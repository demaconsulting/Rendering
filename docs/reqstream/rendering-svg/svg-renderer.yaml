---
# DemaConsulting.Rendering.Svg - SvgRenderer Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the SvgRenderer unit: the stateless SVG renderer that implements
#   IRenderer and writes SVG markup for every supported LayoutTree node kind.
# - These unit requirements decompose the Rendering-Svg-WriteSvgDocument system requirement declared
#   in rendering-svg.yaml.

sections:
  - title: SvgRenderer Requirements
    requirements:
      - id: Rendering-Svg-SvgRenderer-ImplementsIRenderer
        title: >-
          SvgRenderer shall implement the IRenderer interface.
        justification: |
          Implementing the shared renderer interface lets a caller select SVG output uniformly.
        tests:
          - SvgRenderer_Render_SingleBox_ProducesSvgDocument

      - id: Rendering-Svg-SvgRenderer-MediaType
        title: >-
          SvgRenderer shall report the "image/svg+xml" media type.
        justification: |
          The media type lets callers identify and serve the rendered SVG output correctly.
        tests:
          - SvgRenderer_Render_SingleBox_ProducesSvgDocument

      - id: Rendering-Svg-SvgRenderer-DefaultExtension
        title: >-
          SvgRenderer shall report ".svg" as the default file extension.
        justification: |
          The default extension lets callers name persisted SVG outputs consistently.
        tests:
          - SvgRenderer_Render_SingleBox_ProducesSvgDocument

      - id: Rendering-Svg-SvgRenderer-RenderDocument
        title: >-
          SvgRenderer shall write an SVG 1.1 document containing the root svg element.
        justification: |
          A root svg element is required by every SVG viewer and is the container for all rendered
          diagram content.
        tests:
          - SvgRenderer_Render_EmptyTree_ProducesSvgDocument

      - id: Rendering-Svg-SvgRenderer-RenderEmptyTree
        title: >-
          SvgRenderer shall write a non-empty SVG document for an empty layout tree.
        justification: |
          The empty-tree boundary case must still produce a valid SVG container so callers can handle
          empty diagrams without special cases.
        tests:
          - SvgRenderer_Render_EmptyTree_ProducesSvgDocument

      - id: Rendering-Svg-SvgRenderer-RenderBox
        title: >-
          SvgRenderer shall render each box node as a rect element.
        justification: |
          Boxes are the primary diagram element, so each box must appear as an SVG rectangle.
        tests:
          - SvgRenderer_Render_SingleBox_ProducesRectElement

      - id: Rendering-Svg-SvgRenderer-RenderBoxRoundedCorners
        title: >-
          SvgRenderer shall emit rounded-corner attributes for rounded-rectangle box nodes.
        justification: |
          Rounded corners convey the notation for rounded-rectangle boxes.
        tests:
          - SvgRenderer_Render_BoxRoundedRectangle_ProducesRxAttribute

      - id: Rendering-Svg-SvgRenderer-RenderBoxCompartments
        title: >-
          SvgRenderer shall draw box compartment dividers and row text.
        justification: |
          Compartments convey structured properties and operations within box notation.
        tests:
          - SvgRenderer_Render_BoxWithCompartment_ProducesLineAndText

      - id: Rendering-Svg-SvgRenderer-RenderLabel
        title: >-
          SvgRenderer shall render each label node as a text element.
        justification: |
          Labels carry element names and annotations that must appear as SVG text.
        tests:
          - SvgRenderer_Render_SingleLabel_ProducesTextElement

      - id: Rendering-Svg-SvgRenderer-RenderLabelBold
        title: >-
          SvgRenderer shall apply the bold font-weight attribute for bold label nodes.
        justification: |
          Bold styling conveys emphasis requested by the placed layout tree.
        tests:
          - SvgRenderer_Render_LabelWithBold_ProducesBoldAttribute

      - id: Rendering-Svg-SvgRenderer-RenderLabelItalic
        title: >-
          SvgRenderer shall apply the italic font-style attribute for italic label nodes.
        justification: |
          Italic styling conveys emphasis requested by the placed layout tree.
        tests:
          - SvgRenderer_Render_LabelWithItalic_ProducesItalicAttribute

      - id: Rendering-Svg-SvgRenderer-RenderLabelEscaping
        title: >-
          SvgRenderer shall escape XML-special characters in rendered label text.
        justification: |
          Escaping keeps the SVG document well-formed for any model text.
        tests:
          - SvgRenderer_Render_LabelWithXmlSpecialCharacters_ProducesWellFormedEscapedSvg

      - id: Rendering-Svg-SvgRenderer-RenderLine
        title: >-
          SvgRenderer shall render each connector line as a path element.
        justification: |
          Connectors express relationships and must appear as SVG paths following their routed
          waypoints.
        tests:
          - SvgRenderer_Render_SingleLine_ProducesPathElement

      - id: Rendering-Svg-SvgRenderer-RenderLineRoundedCorners
        title: >-
          SvgRenderer shall render rounded connector corners with SVG arc commands.
        justification: |
          Rounded connector corners convey the theme's configured line-corner radius.
        tests:
          - SvgRenderer_Render_SingleLine_WithCornerRadius_ProducesArcInPath
          - SvgRenderer_Render_SingleLine_CollinearInteriorWaypoint_ProducesNoArcInPath

      - id: Rendering-Svg-SvgRenderer-RenderLineDashed
        title: >-
          SvgRenderer shall render dashed connector lines with a stroke-dasharray attribute.
        justification: |
          Dashed styling conveys connector semantics requested by the placed layout tree.
        tests:
          - SvgRenderer_Render_SingleLine_Dashed_ProducesDashArray

      - id: Rendering-Svg-SvgRenderer-RenderLineMidpointLabel
        title: >-
          SvgRenderer shall render connector midpoint labels as text elements.
        justification: |
          Connector labels carry relationship names and semantics that must remain visible in the SVG.
        tests:
          - SvgRenderer_Render_LineWithMidpointLabel_ProducesTextElement

      - id: Rendering-Svg-SvgRenderer-RenderNodeKinds
        title: >-
          SvgRenderer shall render port nodes as rect elements.
        justification: |
          Ports pin connection points to box edges and must be visible as SVG rectangles.
        tests:
          - SvgRenderer_Render_SinglePort_ProducesRect

      - id: Rendering-Svg-SvgRenderer-PortGlyphOutline
        title: >-
          SvgRenderer shall draw a contrasting stroke (Theme.BackgroundColor) around a port glyph's
          rect element, distinct from the glyph's own fill (Theme.StrokeColor).
        justification: |
          A port glyph's solid fill and a connector arrowhead marker's solid fill both use the same
          stroke color and can land within a few pixels of each other at a box edge, so without a
          contrasting outline the two shapes visually merge into a single indistinguishable blob.
          Outlining the port glyph in the background color keeps it visually distinct from an
          adjacent arrowhead.
        tests:
          - SvgRenderer_RenderPort_Rect_HasStrokeDistinctFromFill

      - id: Rendering-Svg-SvgRenderer-RenderPortLabel
        title: >-
          SvgRenderer shall render a port's label as a text element positioned immediately next to
          the port glyph and reading inward toward the box interior: rightward from a left-side
          port, leftward from a right-side port, below a top-side port, and above a bottom-side
          port.
        justification: |
          A named port's label must remain legible and clearly attached to its glyph without ever
          reading outward, off the box, regardless of which of the four faces the layout engine
          anchored it on.
        tests:
          - SvgRenderer_RenderPort_LeftRightLabel_ReadsInward
          - SvgRenderer_RenderPort_TopBottomLabel_ReadsInward

      - id: Rendering-Svg-SvgRenderer-PortLabelSqueeze
        title: >-
          SvgRenderer shall bound a rendered port label's width to LayoutPort.MaxLabelWidth via the
          same FitTextLength squeeze mechanism used for box titles, rather than always drawing the
          label at its natural full text width.
        justification: |
          A port's ExternalLabel previously rendered at natural full text width with no bound
          relative to the box width or the opposite port's label region, so an excessively long
          port label could visually overlap the opposite port's label. Squeezing via
          textLength/lengthAdjust (the same mechanism already used for box titles) compresses the
          label instead, and a MaxLabelWidth defaulting to positive infinity leaves every port with
          no explicit bound rendering exactly as before.
        tests:
          - SvgRenderer_RenderPort_LongLabelWithMaxLabelWidth_AppliesTextLengthConstraint

      - id: Rendering-Svg-SvgRenderer-PortLabelAccurateFit
        title: >-
          SvgRenderer shall decide whether a port label needs a textLength squeeze using the same
          shared PortLabelWidthEstimator the layout engine uses to size LayoutPort.MaxLabelWidth,
          rather than the coarser flat-multiplier heuristic used for box titles and other labels, so
          a port label whose MaxLabelWidth already covers its measured natural width never emits a
          textLength attribute at all.
        justification: |
          FitTextLength's original coarse `text.Length * fontSize * 0.6` estimate could disagree
          with the layout engine's own PortLabelWidthEstimator-based sizing of MaxLabelWidth, so a
          port label the layout engine had already sized to fit exactly could still be squeezed
          unnecessarily at render time. Reconciling the two estimators for port labels specifically
          (the only call site with a layout-time counterpart to reconcile against) closes that gap
          without changing the coarser heuristic's behavior for box titles or generic/connector
          labels, which have no analogous layout-time estimator.
        tests:
          - SvgRenderer_RenderPort_LabelWidthEqualsMaxLabelWidth_NoTextLengthConstraint

      - id: Rendering-Svg-SvgRenderer-ContentInset
        title: >-
          SvgRenderer shall start box title and compartment row content at box.X plus
          Theme.LabelPadding plus box.ContentInsetLeft, rather than assuming a fixed
          box.X + Theme.LabelPadding start, so a reserved left-side port-label margin pushes
          content inward instead of colliding with it.
        justification: |
          A left-side port's label is drawn just inside the box's left edge; without honoring the
          auto-computed ContentInsetLeft margin, compartment or title text starting at the
          previous fixed offset would overlap the port label.
        tests:
          - SvgRenderer_RenderBoxCompartments_ContentInsetLeft_ShiftsRowTextRight

      - id: Rendering-Svg-SvgRenderer-TitleCentersOnBoxWidth
        title: >-
          SvgRenderer shall horizontally center a box's keyword line and bold name title on the
          box's full geometric width (box.X + box.Width / 2.0), regardless of any asymmetric
          box.ContentInsetLeft/ContentInsetRight the box declares.
        justification: |
          A box's title occupies its own row above the title area (ResolveTitleAreaTop), while
          left/right port labels are drawn at the box's vertical center (RenderPort) — a different
          row — so the title never needs to dodge sideways around a side-port label's inset. An
          earlier revision centered the title on the inset-adjusted content area instead, which
          visibly shifted and squeezed titles on boxes with an asymmetric left/right port-label
          inset even though no actual title/port-label collision was possible; this requirement
          restores full geometric centering. box.ContentInsetTop still legitimately widens the
          title's vertical (Y) start position when a top-side port shares the title's row, which is
          unaffected by this requirement.
        tests:
          - SvgRenderer_RenderBoxTitle_AsymmetricContentInsets_StaysAtGeometricCenter

      - id: Rendering-Svg-SvgRenderer-CanvasGrowsForLabels
        title: >-
          SvgRenderer shall grow the rendered canvas width/height, after connector-label placement
          is finalized, to include the full bounding-box extent of every placed connector label,
          rather than sizing the canvas purely from box+routing geometry before label placement
          runs.
        justification: |
          ConnectorLabelPlacer nudges colliding midpoint labels perpendicular to their line, with
          fallback stacking; because the prior canvas size was computed from box+routing geometry
          before this nudging ran, a label could be nudged completely outside the canvas and render
          invisibly clipped. Deferring the canvas-size computation until every label's final
          position (and estimated extent) is known lets the canvas grow to keep every label fully
          visible.
        tests:
          - SvgRenderer_Render_ManyCollidingConnectorLabels_AllLabelsWithinViewBox

      - id: Rendering-Svg-SvgRenderer-RenderBadge
        title: >-
          SvgRenderer shall render filled-circle badge nodes as circle elements.
        justification: |
          Filled-circle badges are notation icons that must appear as SVG circles.
        tests:
          - SvgRenderer_Render_SingleBadge_FilledCircle_ProducesCircle

      - id: Rendering-Svg-SvgRenderer-BadgeBullseye
        title: >-
          SvgRenderer shall render bullseye badge nodes as concentric circle elements.
        justification: |
          Bullseye badges are notation icons whose outer ring and inner disc must remain visible in
          the SVG output.
        tests:
          - SvgRenderer_Render_SingleBadge_Bullseye_ProducesConcentricCircles

      - id: Rendering-Svg-SvgRenderer-BadgeDiamond
        title: >-
          SvgRenderer shall render diamond badge nodes as polygon elements.
        justification: |
          Diamond badges are notation icons that must appear as diamond-shaped SVG polygons.
        tests:
          - SvgRenderer_Render_SingleBadge_Diamond_ProducesPolygon

      - id: Rendering-Svg-SvgRenderer-BadgeHorizontalBar
        title: >-
          SvgRenderer shall render horizontal-bar badge nodes as line elements.
        justification: |
          Horizontal-bar badges are notation icons that must appear as short horizontal SVG lines.
        tests:
          - SvgRenderer_Render_SingleBadge_HorizontalBar_ProducesLine

      - id: Rendering-Svg-SvgRenderer-BadgeVerticalBar
        title: >-
          SvgRenderer shall render vertical-bar badge nodes as line elements.
        justification: |
          Vertical-bar badges are notation icons that must appear as short vertical SVG lines.
        tests:
          - SvgRenderer_Render_SingleBadge_VerticalBar_ProducesLine

      - id: Rendering-Svg-SvgRenderer-RenderBand
        title: >-
          SvgRenderer shall render band nodes as rect elements.
        justification: |
          Bands group diagram contents and must appear as SVG rectangles.
        tests:
          - SvgRenderer_Render_SingleBand_ProducesRect

      - id: Rendering-Svg-SvgRenderer-RenderLifeline
        title: >-
          SvgRenderer shall render lifeline nodes with a header rect and stem line.
        justification: |
          Sequence-diagram lifelines require both the participant header and the vertical stem.
        tests:
          - SvgRenderer_Render_SingleLifeline_ProducesRectAndLine

      - id: Rendering-Svg-SvgRenderer-RenderActivation
        title: >-
          SvgRenderer shall render activation nodes as rect elements.
        justification: |
          Activation bars mark active intervals on lifelines and must appear as narrow rectangles.
        tests:
          - SvgRenderer_Render_SingleActivation_ProducesRect

      - id: Rendering-Svg-SvgRenderer-RenderGrid
        title: >-
          SvgRenderer shall render grid cells as rect elements.
        justification: |
          Tabular notation requires visible SVG cell boundaries.
        tests:
          - SvgRenderer_Render_SingleGrid_ProducesRects

      - id: Rendering-Svg-SvgRenderer-EndMarkers
        title: >-
          SvgRenderer shall define the open-chevron connector end marker as an open polyline.
        justification: |
          An open chevron expresses a distinct connector end shape and must not be closed as a
          polygon.
        tests:
          - OpenChevron_IsDefinedAsPolyline

      - id: Rendering-Svg-SvgRenderer-EndMarkersOpenChevronReference
        title: >-
          SvgRenderer shall reference the open-chevron marker from open-chevron connector ends.
        justification: |
          Referencing the marker from the connector path attaches the open-chevron decoration to the
          rendered line.
        tests:
          - OpenChevronLine_ReferencesOpenChevronMarker

      - id: Rendering-Svg-SvgRenderer-HollowTriangleEndMarkers
        title: >-
          SvgRenderer shall define the hollow-triangle connector end marker as a closed polygon.
        justification: |
          Hollow-triangle markers express relationship direction and must remain closed shapes.
        tests:
          - HollowTriangle_IsDefinedAsClosedPolygon

      - id: Rendering-Svg-SvgRenderer-HollowTriangleEndMarkerReference
        title: >-
          SvgRenderer shall emit a marker-end attribute for hollow-triangle target connector ends.
        justification: |
          Referencing a marker-end attaches the hollow-triangle decoration to the rendered line.
        tests:
          - SvgRenderer_Render_SingleLine_WithHollowTriangleArrowhead_ProducesMarkerEnd

      - id: Rendering-Svg-SvgRenderer-TriangleEndMarkerMetrics
        title: >-
          SvgRenderer shall derive triangle marker dimensions from the shared notation metrics,
          including the stroke-aware tip anchor that places the painted tip on the line endpoint.
        justification: |
          Shared notation metrics keep SVG triangle markers geometrically consistent with raster
          renderers.
        tests:
          - TriangleMarker_DimensionsDeriveFromNotationMetrics

      - id: Rendering-Svg-SvgRenderer-EndMarkerTipOnEndpoint
        title: >-
          SvgRenderer shall define every end marker (at the line end and, mirrored, the line start) so
          that the stroked glyph tip lands exactly on the marker's tip anchor, the line endpoint, is not
          clipped by the marker box, and joins polygon and polyline corners with a bevel.
        justification: |
          A marker tip that is painted past the endpoint pokes into the target box (diagram-quality
          criterion C1: the endpoint must be on the box boundary). The marker box is widened for the
          tip retraction and corners are beveled, as in the raster renderer, so the painted tip is a
          bevel corner on the endpoint instead of a clipped or spiking miter.
        tests:
          - Marker_PaintedTip_LandsOnTipAnchor_AtBothEnds
          - Marker_PaintedTip_LandsOnTipAnchor_WithThickerStroke
          - Marker_PolygonsAndPolylines_UseBevelJoin

      - id: Rendering-Svg-SvgRenderer-EndMarkerPortEndpoint
        title: >-
          SvgRenderer shall shorten a line end that carries an end marker and sits on a port by the
          port half size along its end segment, so the painted tip lands on the port square's outer
          edge, and shall leave other line ends unchanged.
        justification: |
          The port square is painted after the connector and covers the last half port size of the
          marker, hiding the arrowhead tip. Shortening the drawn end, without altering the layout
          waypoints or label placement, puts the visible tip on the visible target.
        tests:
          - LineEndingAtPort_TargetMarker_IsShortenedToPortEdge
          - LineStartingAtPort_SourceMarker_IsShortenedToPortEdge
          - LineEnd_WithoutMarkerOrPort_IsNotShortened

      - id: Rendering-Svg-SvgRenderer-DiamondEndMarkers
        title: >-
          SvgRenderer shall derive diamond marker dimensions from the shared notation metrics.
        justification: |
          Shared notation metrics keep SVG diamond markers geometrically consistent with raster
          renderers.
        tests:
          - DiamondMarker_DimensionsDeriveFromNotationMetrics

      - id: Rendering-Svg-SvgRenderer-DiamondEndMarkerReference
        title: >-
          SvgRenderer shall include the hollow-diamond marker id when rendering a hollow-diamond line
          end, referencing the mirrored line-start-hollow-diamond variant from marker-start when the
          diamond is at the source end.
        justification: |
          The hollow-diamond marker id identifies the connector-end decoration used for diamond line
          ends. A source-end marker is referenced through marker-start, whose x axis points into the
          line, so it must use the mirrored start variant to sit on the line side of the start point.
        tests:
          - SvgRenderer_Render_SingleLine_WithDiamondArrowhead_ProducesDiamondMarker

      - id: Rendering-Svg-SvgRenderer-CrossbarEndMarkers
        title: >-
          SvgRenderer shall include the hollow-triangle-crossbar marker id when rendering a crossbar
          line end, drawing its bar behind the triangle base, separated from it by a clear gap, in a
          marker box and tip anchor widened by the crossbar extension.
        justification: |
          The crossbar marker id identifies the connector-end decoration used for crossbar line ends.
          SysML v2.0 section 8.2.3.6 draws redefinition with the bar behind the triangle base, so the
          marker box is widened (like the dotted variants) and the anchor shifted by the same amount,
          keeping the triangle tip on the target box border.
        tests:
          - SvgRenderer_Render_SingleLine_WithOpenCrossbarArrowhead_ProducesOpenCrossbarMarker
          - EndMarkerCrossbar_BarSitsBehindTriangleBase

      - id: Rendering-Svg-SvgRenderer-CornerClampRenderedMarker
        title: >-
          SvgRenderer shall clamp the radius of the rounded corner before a decorated line end so that
          it leaves at least the end marker's rendered along-line length of straight approach.
        justification: |
          SVG markers scale by the line stroke width, so a marker is longer than its notation length.
          A clamp that used the notation length let the bend begin inside the marker; the clamp uses
          the rendered length (notation length times the marker scale), the same length the PNG
          renderer and the layout reserve.
        tests:
          - LineCornerClamp_UsesRenderedMarkerLength

      - id: Rendering-Svg-SvgRenderer-EndMarkerFilledArrow
        title: >-
          SvgRenderer shall reference the filled-arrow connector end marker for filled-arrow line
          ends.
        justification: |
          Filled-arrow markers express a distinct directed connector style and must remain attached
          to the rendered line.
        tests:
          - SvgRenderer_Render_SingleLine_WithFilledArrow_ProducesFilledArrowMarker

      - id: Rendering-Svg-SvgRenderer-EndMarkerFilledDiamond
        title: >-
          SvgRenderer shall reference the filled-diamond connector end marker for filled-diamond
          line ends, using the mirrored line-start-filled-diamond variant from marker-start for a
          source-end diamond.
        justification: |
          Filled-diamond markers express a distinct connector-end vocabulary and must remain attached
          to the rendered line. A diamond is drawn at the source end of a line, where marker-start
          requires the mirrored start variant to point out of the line start.
        tests:
          - SvgRenderer_Render_SingleLine_WithFilledDiamond_ProducesFilledDiamondMarker

      - id: Rendering-Svg-SvgRenderer-EndMarkerCircle
        title: >-
          SvgRenderer shall reference the circle connector end marker for circle line ends.
        justification: |
          Circle markers express a distinct connector-end vocabulary and must remain attached to the
          rendered line.
        tests:
          - SvgRenderer_Render_SingleLine_WithCircleEnd_ProducesCircleMarker

      - id: Rendering-Svg-SvgRenderer-EndMarkerBar
        title: >-
          SvgRenderer shall reference the bar connector end marker for bar line ends.
        justification: |
          Bar markers express a distinct connector-end vocabulary and must remain attached to the
          rendered line.
        tests:
          - SvgRenderer_Render_SingleLine_WithBarEnd_ProducesBarMarker

      - id: Rendering-Svg-SvgRenderer-EndMarkerDottedTriangles
        title: >-
          SvgRenderer shall define the hollow-triangle-two-dots and hollow-triangle-four-dots end
          markers as the hollow triangle followed by two dots and by a two-by-two grid of four dots,
          with every coordinate derived from the shared notation metrics.
        justification: |
          The SysML feature-typing and reference-subsetting relationships are drawn with a hollow
          triangle trailed by dots. Deriving the triangle, dot radius, dot positions, and marker box
          from NotationMetrics keeps the SVG glyph geometrically identical to the raster glyph and
          leaves the triangle exactly where a plain hollow triangle lands.
        tests:
          - EndMarkerTwoDots_DefinesTriangleAndTwoDotsFromNotationMetrics
          - EndMarkerFourDots_HasTwoByTwoDotGrid

      - id: Rendering-Svg-SvgRenderer-EndMarkerCircledPlus
        title: >-
          SvgRenderer shall define the circled-plus end marker as a background-filled circle crossed
          by two plus arms, with every coordinate derived from the shared notation metrics.
        justification: |
          The SysML owned-membership relationship ends in a circled plus. Deriving the circle radius,
          marker box, anchor, and arm length from NotationMetrics keeps the SVG glyph identical to the
          raster glyph, and the background fill keeps the connector from showing through the circle.
        tests:
          - EndMarkerCircledPlus_DefinesCircleAndTwoPlusArms

      - id: Rendering-Svg-SvgRenderer-EndMarkerDefsOnlyWhenUsed
        title: >-
          SvgRenderer shall write the hollow-triangle-two-dots, hollow-triangle-four-dots, and
          circled-plus marker definitions only when a line in the tree uses them, and shall write
          each used definition exactly once.
        justification: |
          The eight historical end-marker definitions are always written, so a document that uses
          none of the new markers carries exactly those definitions (the redefinition crossbar
          definition has the geometry of the current notation). Writing each new definition once, on
          demand, also avoids duplicate ids no matter how many lines share a marker.
        tests:
          - EndMarkerDefs_NewMarkersUnused_AreNotEmitted
          - EndMarkerDefs_NewMarkerUsedTwice_IsDefinedOnce

      - id: Rendering-Svg-SvgRenderer-EndMarkerStartVariants
        title: >-
          SvgRenderer shall reference a mirrored line-start variant of an end marker from the
          marker-start attribute of a line's source end, defining that variant on demand, and shall
          continue to reference the line-end variant from marker-end.
        justification: |
          An SVG marker-start marker's x axis points into the line, so the end-marker geometry used
          at a line start drew the glyph pointing inward, outside the line start. Earlier versions
          of the renderer had this defect for every source-end marker. A mirrored variant (glyph
          wrapped in a mirror transform with a mirrored anchor) points out of the line start exactly
          as the end variant points out of the line end, so source-end markers now sit on the line.
        tests:
          - EndMarkerSource_CircledPlus_UsesMirroredStartVariant
          - EndMarkerSource_FourDots_UsesMirroredStartVariantOnly
          - EndMarkerSource_LegacyDiamond_UsesMirroredStartVariant
          - EndMarkerBothEnds_NewMarkers_ReferenceStartAndEndVariants

      - id: Rendering-Svg-SvgRenderer-BoxOutlineStyle
        title: >-
          SvgRenderer shall draw a box outline with stroke-dasharray "6 3" for a dashed and "2 2" for
          a dotted BoxAppearance outline style on every box shape, including both paths of a note,
          and shall emit no dash array for a solid outline or a box without an appearance.
        justification: |
          SysML draws some elements (for example, usages and referenced definitions) with a dashed
          outline. Dashing every shape consistently, including the note body and its fold, makes the
          appearance independent of the shape, while omitting the attribute for solid outlines keeps
          existing markup unchanged.
        tests:
          - BoxOutline_DashedOrDotted_EmitsDashArrayForEveryShape
          - BoxOutline_DashedNote_DashesBodyAndFold
          - BoxOutline_SolidOrNoAppearance_EmitsNoDashArray

      - id: Rendering-Svg-SvgRenderer-BoxNameStyle
        title: >-
          SvgRenderer shall emit a box name's font-weight and font-style attributes from the
          BoxAppearance resolved name style, producing the legacy bold markup when no name style is
          specified.
        justification: |
          Notations differ in how a name is typeset (bold, regular, or italic). Resolving the style
          from the appearance lets a caller choose it, while the bold default keeps documents that
          carry no appearance byte-identical to earlier output.
        tests:
          - BoxName_Styles_EmitMatchingFontAttributes
          - BoxName_DefaultAppearance_EmitsLegacyBoldMarkup

      - id: Rendering-Svg-SvgRenderer-BoxKeywordStyle
        title: >-
          SvgRenderer shall emit a box keyword line's font-weight and font-style attributes from the
          BoxAppearance resolved keyword style, producing the legacy italic markup when no keyword
          style is specified.
        justification: |
          A keyword line such as the SysML metaclass name is typeset differently by different
          notations. Resolving the style from the appearance lets a caller choose it, while the
          italic default keeps existing output unchanged.
        tests:
          - BoxKeyword_DefaultItalicAndRegularOverride

      - id: Rendering-Svg-SvgRenderer-CompartmentTitleStyle
        title: >-
          SvgRenderer shall draw a compartment title with the compartment's resolved title style and
          alignment, centering the title with text-anchor middle on the box content area when the
          title alignment is Center, and otherwise as the legacy left-aligned bold italic title.
        justification: |
          SysML compartment titles are centered and italic, whereas the legacy rendering is a bold
          italic left-aligned title. Centering on the content area between the left and right
          content insets keeps the title clear of reserved port-label margins, and the separator line
          still spans the full box width.
        tests:
          - CompartmentTitle_Centered_UsesMiddleAnchorAtContentCentre
          - CompartmentTitle_Default_IsLegacyBoldItalicStart
          - CompartmentSeparator_WithCenteredTitle_SpansFullBoxWidth

      - id: Rendering-Svg-SvgRenderer-FolderTitleInTab
        title: >-
          SvgRenderer shall draw a folder box's name left-aligned inside the folder tab, with no name
          in the body and compartments starting directly under the tab, when the box appearance
          places the folder title in the tab; shall keep the name below the tab by default; and shall
          ignore the setting for non-folder shapes.
        justification: |
          The SysML package notation puts the package name in the tab. Moving the name keeps the body
          free for compartments, and sharing the tab-sizing rules with the layout through BoxMetrics
          guarantees the tab is wide enough for the name it holds.
        tests:
          - FolderNameInTab_DrawsNameInsideTab
          - FolderNameInTab_CompartmentsStartUnderTab
          - FolderBodyTitle_Default_DrawsNameBelowTab
          - FolderNameInTab_NonFolderShape_IsIgnored

      - id: Rendering-Svg-SvgRenderer-BoxCornerIcon
        title: >-
          SvgRenderer shall draw the send and accept corner icons as a polygon in the top-left corner
          of the box body, below the tab for a folder, using the vertices from the shared notation
          metrics.
        justification: |
          SysML send and accept action nodes carry a small pentagon icon (a pointed or notched
          rectangle) in the top-left corner. Using the shared vertex helper keeps the vector icon
          identical to the raster icon, and placing it below the folder tab keeps it inside the body.
        tests:
          - CornerIcon_SendAndAccept_EmitPolygonsWithExpectedVertexCounts
          - CornerIcon_OnFolder_StartsBelowTab

      - id: Rendering-Svg-SvgRenderer-BadgeThickBar
        title: >-
          SvgRenderer shall render thick horizontal-bar and thick vertical-bar badge nodes as filled
          rect elements whose length is the badge size and whose thickness is the badge thickness,
          defaulting to the notation-metric thickness.
        justification: |
          SysML fork and join nodes are drawn as thick bars. A filled rectangle gives the bar its
          thickness, which the stroked line used by the thin bar badges cannot express.
        tests:
          - BadgeThickHorizontalBar_EmitsFilledRectOfSizeAndDefaultThickness
          - BadgeThickVerticalBar_EmitsFilledRectWithCustomThickness

      - id: Rendering-Svg-SvgRenderer-BadgeCrossedCircle
        title: >-
          SvgRenderer shall render crossed-circle badge nodes as a background-filled circle with two
          diagonal line elements whose endpoints lie on the circle.
        justification: |
          The SysML terminate node is a circle crossed by an X. Ending the arms on the circle rather
          than at the bounding box keeps the glyph tidy at every size.
        tests:
          - BadgeCrossedCircle_EmitsCircleAndTwoDiagonalsEndingOnCircle

      - id: Rendering-Svg-SvgRenderer-BandDashed
        title: >-
          SvgRenderer shall draw a band's rect with a stroke-dasharray for a dashed or dotted band
          outline style and without one for a solid band.
        justification: |
          SysML swim lanes are drawn with dashed borders. Omitting the attribute for solid bands
          keeps existing band markup unchanged.
        tests:
          - BandOutline_DashedAndSolid

      - id: Rendering-Svg-SvgRenderer-LifelineRoundedHeader
        title: >-
          SvgRenderer shall draw a lifeline header with rounded corners when the header shape is a
          rounded rectangle, with an optional keyword line above the label, and with the header
          appearance's outline and text styles, while a lifeline without these properties keeps its
          legacy markup.
        justification: |
          SysML lifeline headers are rounded and may carry a keyword line. Honoring the header shape,
          keyword, and appearance lets one lifeline node express the notation, while leaving the
          defaults untouched keeps existing sequence diagrams byte-identical.
        tests:
          - LifelineRoundedHeader_EmitsCornerRadiusAndKeepsDashedStem
          - LifelineKeyword_DrawsGuillemetLineAboveLabel
          - LifelineHeaderAppearance_DashedOutlineAndRegularLabel
          - LifelineDefault_MatchesLegacyMarkup

      - id: Rendering-Svg-SvgRenderer-LabelsAvoidBoxes
        title: >-
          SvgRenderer shall place connector midpoint labels with the obstacle-aware label placer so a
          label whose line midpoint lies on a leaf box is placed clear of that box.
        justification: |
          A connector label is painted over an opaque background; at a midpoint on a leaf box it
          would erase the box border and text. Passing every box to ConnectorLabelPlacer as an
          obstacle moves the label to a clear position on the line.
        tests:
          - LineLabel_MidpointOnLeafBox_IsPlacedClear

      - id: Rendering-Svg-SvgRenderer-DiamondShape
        title: >-
          SvgRenderer shall draw a diamond-shaped box as a polygon through the four bounding-box edge
          midpoints with the depth fill, theme stroke, and optional dash pattern of every other box
          outline, while rectangle boxes keep their plain rect markup.
        justification: |
          A diamond node (decision, merge) must show its real outline for the connectors anchored on it
          to touch it. Reusing the box fill, stroke, and dash handling keeps the diamond consistent
          with the other shapes, and leaving the default shapes untouched keeps existing output
          byte-identical.
        tests:
          - SvgRenderer_Diamond_PolygonPointsAreTheFourEdgeMidpoints
          - SvgRenderer_Diamond_UsesDepthFillAndThemeStroke
          - SvgRenderer_Diamond_DashedAppearance_AddsDashArray
          - SvgRenderer_Diamond_Scaled_ScalesThePolygonPoints
          - SvgRenderer_Rectangle_StillRendersAsRectNotPolygon
          - SvgRenderer_Diamond_Label_IsCenteredOnTheDiamond
          - SysmlPortsParity_DiamondShape_PngOutlineMatchesSvgPolygon

      - id: Rendering-Svg-SvgRenderer-EndLabels
        title: >-
          SvgRenderer shall draw each non-empty end-label slot of a line as a centered text element,
          with the midpoint label's font and background, at the position the end-label placer chose
          after the midpoint labels, escape its text, grow the canvas to include it, and draw nothing
          for a line without end labels.
        justification: |
          Using the shared placer and the midpoint label's style makes the end labels look like the
          other connector text and identical to the PNG output; placing them after the midpoint
          labels leaves existing diagrams unchanged.
        tests:
          - SvgRenderer_EndLabels_DrawnAtThePlacersPositions
          - SvgRenderer_EndLabels_UseTheMidpointLabelStyle
          - SvgRenderer_NullOrEmptyEndLabelSlots_ProduceNoText
          - SvgRenderer_LineWithoutEndLabels_ProducesNoLabelText
          - SvgRenderer_EndLabelText_IsXmlEscaped
          - SvgRenderer_EndLabelBeyondTheCanvas_GrowsTheCanvas
          - SvgRenderer_EndLabels_Scaled_ScalePositionAndFontSize
          - SysmlPortsParity_EndLabel_PngInkCentroidMatchesSvgTextAnchor
