---
# Rendering.CanvasNet System Requirements
#
# PURPOSE:
# - Define the system-level requirement for the DemaConsulting.Rendering.CanvasNet system: the
#   CanvasNet raster renderer package that renders placed layout trees to PNG and JPEG.
# - The system requirement is generic: it describes WHAT the CanvasNet raster system delivers. It
#   decomposes downward (children) into the unit requirements that provide the detailed behavior.
#   Those unit requirements live in the per-unit sibling files:
#     - canvasnet-raster-renderer.yaml  (the shared CanvasNet rasterizer)
#     - png-renderer.yaml               (PNG encoding)
#     - jpeg-renderer.yaml              (JPEG encoding)
# - Each unit requirement is verified by CanvasNet renderer unit tests.
#
# OUT OF SCOPE:
# - WEBP output is deliberately excluded. The Rendering.Skia system this replaces rendered PNG,
#   JPEG, and WEBP, but CanvasNet has no WEBP codec, and the whole point of this migration was to
#   eliminate the native SkiaSharp P/Invoke dependency - adding a WEBP encoder would reintroduce
#   the same class of native, cross-platform dependency this system was built to remove. WEBP
#   support is therefore not carried forward; this is an intentional scope decision, not a gap.

sections:
  - title: Rendering.CanvasNet Requirements
    requirements:
      - id: Rendering-CanvasNet-RenderRasterImage
        title: >-
          The CanvasNet system shall render a placed layout tree to raster images in the PNG and
          JPEG formats using CanvasNet.
        tags: [system]
        justification: |
          Raster output lets rendered diagrams be embedded where vector formats are not accepted,
          shared as ordinary image files, and previewed by any image viewer. PNG and JPEG are the
          formats exposed by the delivered CanvasNet renderer package. WEBP is deliberately
          excluded: CanvasNet has no WEBP codec, and adding one would reintroduce the native
          P/Invoke dependency this CanvasNet-based system replaced SkiaSharp specifically to
          eliminate.
        children:
          - Rendering-CanvasNet-CanvasNetRasterRenderer-DrawsLayoutTree
          - Rendering-CanvasNet-CanvasNetRasterRenderer-ThemeColors
          - Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkers
          - Rendering-CanvasNet-CanvasNetRasterRenderer-EmptyTree
          - Rendering-CanvasNet-CanvasNetRasterRenderer-PortLabelPlacement
          - Rendering-CanvasNet-CanvasNetRasterRenderer-ContentInsetLeft
          - Rendering-CanvasNet-CanvasNetRasterRenderer-PortLabelSqueeze
          - Rendering-CanvasNet-CanvasNetRasterRenderer-TitleCentersOnBoxWidth
          - Rendering-CanvasNet-CanvasNetRasterRenderer-PortGlyphOutline
          - Rendering-CanvasNet-CanvasNetRasterRenderer-CanvasGrowsForLabels
          - Rendering-CanvasNet-CanvasNetRasterRenderer-SharedTypefaces
          - Rendering-CanvasNet-PngRenderer-EmitsPng
          - Rendering-CanvasNet-JpegRenderer-EmitsJpeg
        tests:
          - Render_SingleBox_ProducesPngSignature
          - JpegRenderer_Render_ProducesJpegSignature
