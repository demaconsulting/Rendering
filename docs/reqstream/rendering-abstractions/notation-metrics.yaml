---
# DemaConsulting.Rendering.Abstractions - Notation Metrics Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the notation-metrics unit: NotationMetrics and MarkerVertex shared notation geometry.
# - These unit requirements decompose the Rendering-Abstractions-SharedGeometry system requirement declared in
#   rendering-abstractions.yaml.

sections:
  - title: Notation Metrics Requirements
    requirements:
      - id: Rendering-Abstractions-NotationMetrics-TriangleDimensions
        title: >-
          The notation metrics shall define the triangular end-marker geometry with the canonical
          marker dimensions.
        justification: |
          The open chevron, hollow triangle, and filled arrow all share one triangle geometry;
          defining it once ensures every renderer draws these markers identically.
        tests:
          - TriangleFamily_HasCanonicalValues
          - TriangleVertices_ReproduceSvgBoxPoints

      - id: Rendering-Abstractions-NotationMetrics-TriangleApexOnEndpoint
        title: >-
          The notation metrics shall define a triangular end-marker apex vertex that lands on the
          marker's tip anchor, with no overshoot past it.
        justification: |
          The apex must sit on the tip anchor, and the anchor on the line endpoint (the box boundary),
          so the marker does not poke into the target box; defining this once keeps every renderer's
          markers aligned with the boundary.
        tests:
          - TriangleVertices_Apex_LandsOnEndpoint

      - id: Rendering-Abstractions-NotationMetrics-TipRetraction
        title: >-
          The notation metrics shall report, per end-marker style and theme, the distance a marker glyph
          is retracted along the line so its STROKED tip lands on the line endpoint, and the resulting
          marker box length and tip anchor, and shall reject a null theme with an argument-null error.
        justification: |
          A stroked shape paints beyond its geometric vertex (a bevel-joined corner by half the stroke
          width times the sine of its half angle, a circle or bar by the full half stroke width), so
          drawing the vertex on the endpoint leaves the painted tip past it, inside the target box.
          Deriving the retraction, and the box and anchor that follow from it, in one place lets both
          renderers land the painted tip exactly on the endpoint; a null theme must fail fast.
        tests:
          - TipRetraction_IsHalfStrokeTimesTipFactor
          - TipRetraction_ScalesWithThemeStrokeWidth_AndRejectsNullTheme
          - MarkerAnchor_KeepsRetractedAnchorInsideBox_AndFeedsRenderedLength

      - id: Rendering-Abstractions-NotationMetrics-DiamondDimensions
        title: >-
          The notation metrics shall define the diamond end-marker geometry with the canonical
          dimensions.
        justification: |
          The hollow and filled diamonds share one geometry; defining it once keeps the two
          renderers' diamonds identical.
        tests:
          - Diamond_HasCanonicalValues
          - DiamondVertices_ReproduceSvgBoxPoints

      - id: Rendering-Abstractions-NotationMetrics-DiamondFarPointOnEndpoint
        title: >-
          The notation metrics shall define a diamond end-marker far vertex that lands on the
          line endpoint.
        justification: |
          The far point must sit exactly on the endpoint so the diamond anchors precisely on the
          line; defining this once keeps every renderer's diamonds correctly anchored.
        tests:
          - DiamondVertices_FarPoint_LandsOnEndpoint

      - id: Rendering-Abstractions-NotationMetrics-CircleBarGeometry
        title: >-
          The notation metrics shall define the canonical circle and bar end-marker geometry.
        justification: |
          Circle and bar markers complete the end-decoration set; defining their canonical
          dimensions once keeps them consistent across renderers.
        tests:
          - CircleAndBar_HaveCanonicalValues

      - id: Rendering-Abstractions-NotationMetrics-Crossbar
        title: >-
          The notation metrics shall define the redefinition marker geometry: a crossbar behind the
          triangle base, separated from it by a gap and spanning the base height, in a marker box and
          tip anchor widened by the crossbar extension so the triangle lands where a plain hollow
          triangle does.
        justification: |
          SysML v2.0 section 8.2.3.6 draws redefinition as a hollow triangle followed, on the line
          side of the base, by a perpendicular bar. Defining the bar position, its length, the
          widened marker box and the unchanged triangle anchor once keeps the SVG and PNG renderers
          drawing the identical marker, with its tip on the target box border.
        tests:
          - Crossbar_SitsBehindTriangleBase

      - id: Rendering-Abstractions-NotationMetrics-AlongLineLength
        title: >-
          The notation metrics shall report the along-line length consumed by each end-marker style.
        justification: |
          Layout strategies reserve a clean straight approach and renderers clamp the final corner
          radius using this length, so both must read it from one place to stay in agreement.
        tests:
          - AlongLineLength_MatchesMarkerBox
          - AlongLineLength_NewStyles_MatchMarkerBoxesAndLegacyUnchanged

      - id: Rendering-Abstractions-NotationMetrics-PortSquare
        title: >-
          The notation metrics shall define the port-square decoration proportion used to draw
          box decorations.
        justification: |
          This intrinsic, theme-independent proportion describes SysML port notation; defining it
          once ensures the SVG and PNG renderers draw the same shape at the same size.
        tests:
          - Port_SizeIsTwiceHalfSize

      - id: Rendering-Abstractions-NotationMetrics-FolderTab
        title: >-
          The notation metrics shall define the folder-tab decoration proportion used to draw
          box decorations.
        justification: |
          This intrinsic, theme-independent proportion describes SysML folder-tab notation; defining
          it once ensures the SVG and PNG renderers draw the same shape at the same size.
        tests:
          - FolderTab_HasDocumentedConstants

      - id: Rendering-Abstractions-NotationMetrics-NoteFold
        title: >-
          The notation metrics shall define the note-fold decoration proportion used to draw box
          decorations.
        justification: |
          This intrinsic, theme-independent proportion describes SysML note-fold notation; defining
          it once ensures the SVG and PNG renderers draw the same shape at the same size.
        tests:
          - NoteFold_HasDocumentedConstants

      - id: Rendering-Abstractions-NotationMetrics-RoundedRectCorner
        title: >-
          The notation metrics shall define the rounded-rectangle corner proportion used to draw
          box decorations.
        justification: |
          This intrinsic, theme-independent proportion describes SysML rounded-rectangle notation;
          defining it once ensures the SVG and PNG renderers draw the same shape at the same size.
        tests:
          - RoundedRectRadius_IsThemeRadiusTimesFactor

      - id: Rendering-Abstractions-NotationMetrics-RejectNullTheme
        title: >-
          NotationMetrics.RoundedRectRadius shall reject a null theme argument with an argument-null
          error.
        justification: |
          RoundedRectRadius derives its result from the theme's corner radius; failing fast on a null
          theme prevents a downstream null-reference failure and surfaces the caller's error at the
          public boundary, matching the convention used by the other geometry-helper classes.
        tests:
          - RoundedRectRadius_NullTheme_ThrowsArgumentNullException

      - id: Rendering-Abstractions-NotationMetrics-Badge
        title: >-
          The notation metrics shall define the badge decoration proportions used to draw box
          decorations.
        justification: |
          These intrinsic, theme-independent proportions describe SysML badge notation; defining
          them once ensures the SVG and PNG renderers draw the same shapes at the same sizes.
        tests:
          - BadgeFractions_HaveDocumentedValues

      - id: Rendering-Abstractions-NotationMetrics-LabelBackground
        title: >-
          The notation metrics shall define the label-background proportion used to draw box
          decorations.
        justification: |
          This intrinsic, theme-independent proportion describes the SysML label-background
          notation; defining it once ensures the SVG and PNG renderers draw the same shape at the
          same size.
        tests:
          - LabelBackground_ExtentMatchesInset

      - id: Rendering-Abstractions-NotationMetrics-DottedTriangleMarkers
        title: >-
          The notation metrics shall define the hollow-triangle-with-two-dots and
          hollow-triangle-with-four-dots end-marker geometry: the dot centers straddling the line
          just behind the triangle base, and a marker box and tip anchor widened by the dot extension
          so the triangle itself lands where a plain hollow triangle does.
        justification: |
          SysML v2 feature typing and reference subsetting append dots to a hollow triangle. Defining
          the dot positions, the widened marker box, and the unchanged triangle anchor once keeps the
          SVG and PNG renderers drawing the identical marker at the identical place on the line.
        tests:
          - DottedTriangles_HaveCanonicalValues
          - DotCenters_TwoDots_StraddleLineBehindBase
          - DotCenters_FourDots_FormTwoByTwoGrid
          - DotCenters_NonDottedStyles_AreEmpty
          - DotCenters_StayInsideMarkerBox
          - TriangleFamilyBox_DottedVariants_KeepTriangleTipAnchored

      - id: Rendering-Abstractions-NotationMetrics-CircledPlusMarker
        title: >-
          The notation metrics shall define the circled-plus end-marker geometry: a circle with the
          far edge on the line endpoint and plus arms spanning the circle diameter.
        justification: |
          SysML v2 owned membership is drawn as a circle containing a plus sign. Defining its radius,
          marker box, tip anchor, and arm length once keeps both renderers drawing the same marker.
        tests:
          - CircledPlus_HasCanonicalValues

      - id: Rendering-Abstractions-NotationMetrics-MarkerScale
        title: >-
          The notation metrics shall define one marker scale, the theme stroke width, at which every
          renderer draws every end marker, together with the marker outline width derived from it, and
          shall reject a null theme with an argument-null error.
        justification: |
          The SVG renderer scales marker content by the stroke width of the referencing line (the
          default marker units). The raster renderer applies the same factor, read from the same
          place, so a PNG marker has exactly the size of the SVG marker instead of two thirds of it;
          layout and label placement reserve space with the same value. A null theme must fail fast
          at the public boundary.
        tests:
          - MarkerScale_IsThemeStrokeWidth_AndMarkerStrokeIsScaledStroke

      - id: Rendering-Abstractions-NotationMetrics-RenderedAlongLineLength
        title: >-
          The notation metrics shall report the rendered along-line length of an end-marker style as
          its marker box length (including the tip retraction) scaled by the marker scale, and shall
          reject a null theme with an argument-null error.
        justification: |
          Both renderers draw markers at the marker scale. A layout that must keep a decoration clear
          of the preceding corner, and a renderer that clamps the final corner radius, need the drawn
          length from one shared place, and a null theme must fail fast at the public boundary.
        tests:
          - RenderedAlongLineLength_ScalesNotationLengthByStrokeWidth
          - RenderedAlongLineLength_NullTheme_Throws

      - id: Rendering-Abstractions-NotationMetrics-AcrossHalfWidth
        title: >-
          The notation metrics shall report the across-line half width of each end-marker style as
          the widest point of its glyph measured from the line centre.
        justification: |
          Callers that reserve clearance beside a decorated line end need the perpendicular extent of
          each marker; reading it from one place keeps layout and renderers in agreement.
        tests:
          - AcrossHalfWidth_EveryStyle_MatchesWidestPoint

      - id: Rendering-Abstractions-NotationMetrics-ThickBarBadge
        title: >-
          The notation metrics shall define the default thickness of the thick fork/join bar badge.
        justification: |
          A thick bar badge takes its length from the caller and its thickness from a shared default;
          defining that default once keeps both renderers drawing the same bar.
        tests:
          - ThickBarAndCrossedCircle_HaveCanonicalValues

      - id: Rendering-Abstractions-NotationMetrics-CrossedCircleBadge
        title: >-
          The notation metrics shall define the crossed-circle (terminate) badge arm fraction so the
          four arms of the X end exactly on the circle.
        justification: |
          The arms of the X must end on the circle at 45 degrees (the cosine of 45 degrees times the
          radius along each axis); defining that fraction once keeps both renderers drawing the same
          glyph.
        tests:
          - ThickBarAndCrossedCircle_HaveCanonicalValues

      - id: Rendering-Abstractions-NotationMetrics-CornerIcon
        title: >-
          The notation metrics shall define the send and accept corner-icon polygons within the
          documented icon box, the send icon as a convex right-pointing pentagon, the accept icon as
          the same pentagon with a triangular notch in its left edge, and no polygon for no icon.
        justification: |
          SysML v2 send and accept actions carry a small pictorial icon in the corner of the box.
          Defining the polygon vertices once, in icon-local units, keeps both renderers drawing the
          same icon and makes any proportion change a single-place edit.
        tests:
          - CornerIconVertices_Send_IsConvexPentagonInsideIconBox
          - CornerIconVertices_Accept_HasNotchInLeftEdge
          - CornerIconVertices_None_IsEmpty

      - id: Rendering-Abstractions-NotationMetrics-DiamondBoxVertices
        title: >-
          NotationMetrics shall provide the outline vertices of a diamond box, the midpoints of the
          four bounding-box edges in the order top, right, bottom, left.
        justification: |
          Both renderers draw the diamond outline through one helper so the SVG polygon and the raster
          path cannot drift apart, and the layout's anchor geometry describes the same shape.
        tests:
          - NotationMetrics_DiamondBoxVertices_AreTheBoxEdgeMidpointsTopRightBottomLeft
          - NotationMetrics_DiamondBoxVertices_ZeroSizeBox_CollapsesToThePoint
          - BoxMetrics_TitleCursorTop_Diamond_MatchesARectangle

      - id: Rendering-Abstractions-NotationMetrics-PortGlyphGeometry
        title: >-
          NotationMetrics shall provide the half size of each port glyph (the legacy 4 px for no
          appearance or a filled square, 6 px for an outlined glyph, 5 px for a proxy circle) and the
          bounds of a port glyph.
        justification: |
          The glyph half size is the single source for how far a marker end is shortened and how far an
          inward label is offset in both renderers; keeping the legacy value for the legacy look leaves
          every existing diagram unchanged.
        tests:
          - NotationMetrics_PortGlyphHalfSizeFor_NullAndFilled_AreTheLegacyHalfSize
          - NotationMetrics_PortGlyphHalfSizeFor_OutlinedAndProxy_UseTheirOwnSizes
          - NotationMetrics_PortGlyphBounds_AreCenteredOnThePortWithTheGlyphHalfSize

      - id: Rendering-Abstractions-NotationMetrics-PortArrowOrientation
        title: >-
          NotationMetrics shall provide the polylines of a port's direction arrow in glyph-local
          coordinates, oriented for the port's face: in points into the owning part, out points away
          from it, and inout is double-headed and symmetric, all inside the glyph.
        justification: |
          The SVG and raster renderers draw the arrow from one source, so the two cannot disagree about
          which way an in or out port points on any of the four faces.
        tests:
          - NotationMetrics_PortArrowSegments_None_IsEmpty
          - NotationMetrics_PortArrowSegments_InAndOut_PointIntoAndAwayFromThePart
          - NotationMetrics_PortArrowSegments_InOut_IsSymmetricAndDoubleHeaded
          - NotationMetrics_PortArrowSegments_StayInsideTheGlyph

      - id: Rendering-Abstractions-NotationMetrics-PortOutwardLabel
        title: >-
          NotationMetrics shall decide whether a port's external label is outward and provide its anchor
          and bounds: entirely outside the owning box, beginning beyond the glyph, and clear of the
          connector axis on every face.
        justification: |
          The SysML notation draws the port name and type outside the owning part. Sharing the anchor
          and bounds lets both renderers draw it identically and lets the layout and the end-label
          placer reserve and avoid the same rectangle.
        tests:
          - NotationMetrics_IsOutwardLabel_RequiresOutwardPlacementAndALabel
          - NotationMetrics_PortOutwardLabelBounds_LieOutsideTheBoxAndClearOfTheConnector
          - NotationMetrics_PortOutwardLabelAnchor_LiesInsideTheBounds
