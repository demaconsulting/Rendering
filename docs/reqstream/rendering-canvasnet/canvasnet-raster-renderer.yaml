---
# DemaConsulting.Rendering.CanvasNet - CanvasNetRasterRenderer Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the CanvasNetRasterRenderer unit: the shared CanvasNet rasterizer
#   that draws placed layout-tree nodes to a managed surface before concrete format renderers
#   encode it.
# - These unit requirements decompose the Rendering-CanvasNet-RenderRasterImage system requirement
#   declared in rendering-canvasnet.yaml.

sections:
  - title: CanvasNetRasterRenderer Requirements
    requirements:
      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-DrawsLayoutTree
        title: >-
          CanvasNetRasterRenderer shall rasterize every layout-tree node kind - boxes, labels,
          lines, ports, badges, bands, lifelines, activations, and grids - onto a surface
          initialized with the render theme's background color.
        justification: |
          The base rasterizer draws all node kinds so that every concrete format renderer produces
          a complete diagram; the theme background makes the output usable in formats without
          transparency, such as JPEG, while keeping the canvas fill, hollow-marker occlusion, and
          midpoint-label backplates consistent under non-white themes.
        tests:
          - PngRenderer_Render_SingleBox_ProducesNonEmptyOutput
          - PngRenderer_Render_BackgroundIsThemeBackground
          - PngRenderer_Render_SingleLine_PixelOnLineIsStrokeColor
          - PngRenderer_Render_SinglePort_CenterPixelIsStrokeColor
          - PngRenderer_Render_SingleBadge_FilledCircle_CenterPixelIsStrokeColor
          - PngRenderer_Render_SingleLifeline_StemPixelIsStrokeColor
          - PngRenderer_Render_SingleActivation_CenterPixelIsWhite
          - PngRenderer_Render_SingleBand_BorderIsStrokeColor
          - PngRenderer_Render_DeeplyNestedBoxes_DoesNotStackOverflow
          - PngRenderer_Render_LabelWithXmlSpecialCharacters_ProducesValidPng

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-ThemeColors
        title: >-
          CanvasNetRasterRenderer shall derive box and grid fill colors from the render theme,
          indexing the depth-fill palette by nesting depth.
        justification: |
          Deriving colors from the theme keeps raster output visually consistent with the SVG
          renderer and lets callers restyle diagrams by supplying a different theme.
        tests:
          - PngRenderer_Render_SingleBox_FillColorMatchesTheme
          - PngRenderer_Render_SingleBox_DepthOneUsesSecondColor
          - PngRenderer_Render_SingleGrid_HeaderFillMatchesTheme

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkers
        title: >-
          CanvasNetRasterRenderer shall draw connector end markers whose geometry derives from the
          shared notation metrics and is drawn at the shared marker scale (the theme stroke width),
          so raster markers have the geometry and the size of the SVG markers.
        justification: |
          End markers express relationship direction and kind; sharing the notation metrics and the
          marker scale with the SVG renderer keeps the two output formats visually identical. Drawing
          at the notation size would leave a PNG marker two thirds the size of the SVG marker.
        tests:
          - FilledArrow_AlongLength_MatchesNotationMetrics
          - FilledArrow_BaseWidth_MatchesNotationMetrics
          - OpenChevron_HasFewerInkPixelsThanClosedTriangle
          - PngRenderer_Render_DrawArrowhead_OpenWithCrossbar_ProducesNonEmptyOutput

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EmptyTree
        title: >-
          CanvasNetRasterRenderer shall render an empty layout tree to a valid image with a minimum
          surface size of one by one pixels.
        justification: |
          Enforcing a minimum surface size prevents allocation errors for empty diagrams, so callers
          never have to special-case an empty layout.
        tests:
          - PngRenderer_Render_EmptyTree_WritesPngSignature

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-PortLabelPlacement
        title: >-
          CanvasNetRasterRenderer shall draw each port's glyph and label inside the box,
          immediately next to the glyph, reading inward toward the box interior on every one of the
          four sides.
        justification: |
          The raster renderer must match the SVG renderer's port-label placement so both output
          formats produced from the same LayoutTree read identically to a viewer, per the
          single-layout/multi-renderer design.
        tests:
          - PngRenderer_RenderPort_AnySide_ProducesNonBackgroundPixels

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-ContentInsetLeft
        title: >-
          CanvasNetRasterRenderer shall start box title/compartment content at box.X plus
          Theme.LabelPadding plus box.ContentInsetLeft (mirroring the SVG renderer) rather than a
          fixed offset that ignores a reserved port-label margin.
        justification: |
          The raster renderer must match the SVG renderer's reserved-margin behavior so both output
          formats produced from the same LayoutTree read identically to a viewer, per the
          single-layout/multi-renderer design.
        tests:
          - PngRenderer_RenderBoxCompartments_ContentInsetLeft_ShiftsRowContentRight

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-PortLabelSqueeze
        title: >-
          CanvasNetRasterRenderer shall bound a rendered port label's width to
          LayoutPort.MaxLabelWidth using the same font-size-shrink squeeze mechanism used for box
          titles, rather than always drawing the label at its natural full text width.
        justification: |
          A port's ExternalLabel previously rendered at natural full text width with no bound
          relative to the box width or the opposite port's label region, so an excessively long
          port label could visually overlap the opposite port's label. A MaxLabelWidth defaulting
          to positive infinity leaves every port with no explicit bound rendering exactly as before.
        tests:
          - PngRenderer_RenderPort_LongLabelWithMaxLabelWidth_SqueezesToFit

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-TitleCentersOnBoxWidth
        title: >-
          CanvasNetRasterRenderer shall horizontally center a box's keyword line and bold name
          title on the box's full geometric width (box.X + box.Width / 2.0), regardless of any
          asymmetric box.ContentInsetLeft/ContentInsetRight the box declares.
        justification: |
          A box's title occupies its own row above the title area (ResolveTitleAreaTop), while
          left/right port labels are drawn at the box's vertical center (DrawPortLabel) — a
          different row — so the title never needs to dodge sideways around a side-port label's
          inset. An earlier revision centered the title on the inset-adjusted content area instead,
          which visibly shifted and squeezed titles on boxes with an asymmetric left/right
          port-label inset even though no actual title/port-label collision was possible; this
          requirement restores full geometric centering, matching the SVG renderer.
          box.ContentInsetTop still legitimately widens the title's vertical (Y) start position
          when a top-side port shares the title's row, which is unaffected by this requirement.
        tests:
          - PngRenderer_RenderBoxTitle_AsymmetricContentInsets_StaysAtGeometricCenter

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-PortGlyphOutline
        title: >-
          CanvasNetRasterRenderer shall draw a contrasting stroke (Theme.BackgroundColor) around a
          port glyph's rendered square, distinct from the glyph's own fill (Theme.StrokeColor).
        justification: |
          A port glyph's solid fill and a connector arrowhead marker's solid fill both use the same
          stroke color and can land within a few pixels of each other at a box edge, so without a
          contrasting outline the two shapes visually merge into a single indistinguishable blob.
          Outlining the port glyph in the background color keeps it visually distinct from an
          adjacent arrowhead, matching the SVG renderer.
        tests:
          - PngRenderer_RenderPort_Rect_HasStrokeDistinctFromFill

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-CanvasGrowsForLabels
        title: >-
          CanvasNetRasterRenderer shall grow the allocated surface width and height, after
          connector-label placement is finalized, to include the full bounding-box extent of every
          placed connector label, rather than sizing the surface purely from box and routing
          geometry before label placement runs.
        justification: |
          ConnectorLabelPlacer nudges colliding midpoint labels perpendicular to their line, with
          fallback stacking; because the prior raster size was computed from box and routing
          geometry before this nudging ran, a label could be nudged completely outside the surface
          and render invisibly clipped. Deferring the surface-size computation until every label's
          final position (and estimated extent) is known lets the surface grow to keep every label
          fully visible.
        tests:
          - PngRenderer_Render_ManyCollidingConnectorLabels_BitmapGrowsToFitAllLabels

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-SharedTypefaces
        title: >-
          CanvasNetRasterRenderer shall resolve a stable, distinct TrueTypeFont instance per
          bold/italic variant through the internal CanvasNetTypefaces helper, shared by all drawing
          code in the unit.
        justification: |
          CanvasNetRasterRenderer's four regular/bold/italic/bold-italic typeface variants are
          centralized in one internal helper so every drawing call site in the unit measures and
          draws against the exact same lazily loaded embedded Noto Sans typeface instances, with no
          duplicate independently loaded copy of the font resources.
        tests:
          - CanvasNetTypefaces_Resolve_ReturnsStableDistinctTypefacesPerVariant

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerDottedTriangles
        title: >-
          CanvasNetRasterRenderer shall draw the hollow-triangle-two-dots and hollow-triangle-four-dots
          end markers as the hollow triangle followed by two dots and by a two-by-two grid of four dots
          at the dot centers given by the shared notation metrics.
        justification: |
          The SysML feature-typing and reference-subsetting relationships are drawn with a hollow
          triangle trailed by dots. Taking the dot centers and radius from NotationMetrics, the same
          source the SVG renderer uses, keeps the raster glyph identical to the vector glyph, and the
          triangle lands exactly where a plain hollow triangle does.
        tests:
          - PngTwoDots_InkAtBothDotCenters_TriangleTipUnchanged
          - PngFourDots_InkAtAllFourDotCenters

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerCircledPlus
        title: >-
          CanvasNetRasterRenderer shall draw the circled-plus end marker as a background-filled ring
          crossed by two plus arms, with the geometry derived from the shared notation metrics.
        justification: |
          The SysML owned-membership relationship ends in a circled plus. The background fill keeps
          the connector from showing through the ring, and sharing NotationMetrics with the SVG
          renderer keeps the two glyphs identical.
        tests:
          - PngCircledPlus_RingAndArmsHaveInkAndInteriorIsEmpty

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerSvgParity
        title: >-
          CanvasNetRasterRenderer shall draw every end-marker style, at both ends of a line and for
          any theme stroke width, with the same extents along and across the line as the SVG renderer's
          marker, so a PNG and an SVG of one tree show markers of one size.
        justification: |
          The SVG renderer is the reference for marker size: its markers scale by the line stroke
          width. A raster marker that drew at the notation size was two thirds of that, which made the
          dots and the circled plus barely legible. Comparing the pixel footprint of each PNG marker
          with the SVG marker geometry converted to pixels guards the parity for every style.
        tests:
          - EndMarkerParity_TargetEnd_PngFootprintMatchesSvgGeometry
          - EndMarkerParity_SourceEnd_PngFootprintMatchesMirroredSvgGeometry
          - EndMarkerParity_ThickerStrokeTheme_FootprintsStillMatch
          - EndMarkerParity_TipLandsOnEndpoint_InBothRenderers
          - EndMarkerParity_PortEnd_ShortenedIdenticallyInBothRenderers

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerTipOnEndpoint
        title: >-
          CanvasNetRasterRenderer shall draw every end marker, at both ends of a line, so that its
          stroked tip lands on the line endpoint (the box boundary) and puts no marker ink past the
          endpoint or into the target box interior.
        justification: |
          A tip painted past the endpoint pokes into the target box (diagram-quality criterion C1: the
          endpoint must be on the box boundary). The glyph is retracted by the shared stroke-aware tip
          retraction, the same one the SVG renderer applies, so the bevel-joined, round or butt painted
          tip is on the endpoint rather than 1 to 2 px beyond it.
        tests:
          - EndMarker_TargetEnd_PaintedTipDoesNotPassEndpoint
          - EndMarker_SourceEnd_PaintedTipDoesNotPassStartPoint
          - EndMarker_OnBoxFace_DoesNotInkTheBoxInterior

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerPortEndpoint
        title: >-
          CanvasNetRasterRenderer shall shorten a line end that carries an end marker and sits on a
          port by the port half size along its end segment, so the painted tip lands on the port
          square's outer edge and the arrowhead is not hidden under the port glyph.
        justification: |
          The port square is painted after the connector and covers the last half port size of the
          marker. Shortening the drawn end (identically to the SVG renderer, without altering the
          layout waypoints) puts the visible tip on the visible target.
        tests:
          - EndMarker_OnPort_IsNotHiddenUnderPortGlyph

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerCrossbar
        title: >-
          CanvasNetRasterRenderer shall draw the redefinition marker as a hollow triangle followed, on
          the line side of its base and separated from it by a clear gap, by a perpendicular bar
          spanning the base height, at either end of a line.
        justification: |
          SysML v2.0 section 8.2.3.6 draws redefinition with the bar behind the triangle base, not
          against its apex. Taking the bar position and length from NotationMetrics keeps the raster
          glyph identical to the SVG glyph, with the triangle tip on the target box border.
        tests:
          - PngCrossbar_BarSitsBehindBaseWithGap
          - PngCrossbar_AtSourceEnd_BarFollowsBaseAlongLine

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerCornerClamp
        title: >-
          CanvasNetRasterRenderer shall clamp the radius of the rounded corner before a decorated line
          end so that it leaves at least the end marker's rendered along-line length of straight
          approach.
        justification: |
          A bend that begins inside the marker would collapse into a sharp corner under the
          arrowhead. The clamp uses the length at which the marker is drawn (notation length times the
          marker scale), the same length the SVG renderer and the layout reserve.
        tests:
          - PngLineCornerClamp_UsesRenderedMarkerLength

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkerSourceEnd
        title: >-
          CanvasNetRasterRenderer shall draw the circled-plus and dotted-triangle markers at a line's
          source end on the line side of the start point, with the dots following the triangle base
          along the line.
        justification: |
          The marker anchor is the line endpoint and the glyph body extends back along the line, for
          either end of the line. This is the behavior the SVG renderer reproduces with its mirrored
          line-start marker variants, so both formats place source-end glyphs identically.
        tests:
          - PngCircledPlus_AtSourceEnd_SitsOnLineSideOfStartPoint
          - PngTwoDots_AtSourceEnd_DotsFollowTriangleBaseAlongLine

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-BoxOutlineStyle
        title: >-
          CanvasNetRasterRenderer shall stroke a dashed or dotted BoxAppearance outline with a dash
          pattern of 6 and 3 pixels or 2 and 2 pixels, scaled by the render scale, on every box shape,
          and shall stroke a solid outline without gaps.
        justification: |
          SysML draws some elements with a dashed outline. The rectangle strokers of the drawing
          library do not dash, so dashed outlines are stroked as paths; the dash lengths match the
          SVG stroke-dasharray values so both formats look the same.
        tests:
          - PngBoxOutline_Dashed_HasGapsAlongTopEdgeAndSolidHasNone

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-BoxNameStyle
        title: >-
          CanvasNetRasterRenderer shall draw a box name in the font selected by the BoxAppearance
          resolved name style, bold by default.
        justification: |
          Notations differ in how a name is typeset. Resolving the style from the appearance lets a
          caller choose it, while the bold default keeps boxes without an appearance unchanged.
        tests:
          - PngBoxName_RegularHasLessInkThanBold_DefaultIsBold
          - PngBoxName_Italic_SlantsRelativeToRegular

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-CompartmentTitleStyle
        title: >-
          CanvasNetRasterRenderer shall draw a compartment title with the compartment's resolved title
          style and, when the title alignment is Center, centered on the box content area between the
          left and right content insets.
        justification: |
          SysML compartment titles are centered and italic, whereas the legacy title is bold italic
          and left-aligned. Centering on the content area keeps the title clear of reserved
          port-label margins and matches the SVG renderer.
        tests:
          - PngCompartmentTitle_Centered_InkCenteredInContentArea

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-FolderTitleInTab
        title: >-
          CanvasNetRasterRenderer shall draw a folder box's name inside the folder tab, with no name
          in the body band, when the box appearance places the folder title in the tab.
        justification: |
          The SysML package notation puts the package name in the tab. Sizing the tab through the
          shared BoxMetrics helpers keeps it wide enough for the name and identical to the SVG
          renderer's tab.
        tests:
          - PngFolderNameInTab_InkInTabAndNoneInBodyBand

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-BoxCornerIcon
        title: >-
          CanvasNetRasterRenderer shall draw the send and accept corner icons as a filled and stroked
          polygon in the top-left corner of the box body, using the vertices from the shared notation
          metrics, with a notch in the left edge of the accept icon.
        justification: |
          SysML send and accept action nodes carry a small pentagon icon in the top-left corner; the
          accept icon has a notched left edge. Using the shared vertex helper keeps the raster icon
          identical to the vector icon.
        tests:
          - PngCornerIcon_SendHasLeftEdgeAcceptHasNotch

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-BadgeThickBar
        title: >-
          CanvasNetRasterRenderer shall render thick horizontal-bar and thick vertical-bar badge nodes
          as filled rectangles whose length is the badge size and whose thickness is the badge
          thickness, defaulting to the notation-metric thickness.
        justification: |
          SysML fork and join nodes are drawn as thick bars; a filled rectangle expresses the
          thickness, matching the SVG renderer.
        tests:
          - PngBadgeThickHorizontalBar_FillsSizeByThickness
          - PngBadgeThickVerticalBar_FillsThicknessBySize

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-BadgeCrossedCircle
        title: >-
          CanvasNetRasterRenderer shall render crossed-circle badge nodes as a background-filled ring
          with two diagonal arms ending on the ring.
        justification: |
          The SysML terminate node is a circle crossed by an X; ending the arms on the ring matches
          the SVG renderer.
        tests:
          - PngBadgeCrossedCircle_RingAndDiagonalArmsHaveInk

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-BandDashed
        title: >-
          CanvasNetRasterRenderer shall stroke a band's outline with a dash pattern for a dashed or
          dotted band outline style and without gaps for a solid band.
        justification: |
          SysML swim lanes are drawn with dashed borders; the dash pattern matches the SVG renderer.
        tests:
          - PngBand_Dashed_HasGapsAlongTopEdge

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-LifelineRoundedHeader
        title: >-
          CanvasNetRasterRenderer shall draw a lifeline header with a cut corner when the header shape
          is a rounded rectangle, with a keyword text row above the label when a keyword is present,
          and with a dashed outline when the header appearance requests one.
        justification: |
          SysML lifeline headers are rounded and may carry a keyword line. Honoring the header shape,
          keyword, and appearance lets one lifeline node express the notation, matching the SVG
          renderer.
        tests:
          - PngLifeline_RoundedHeader_CutsCornerAndSharpDoesNot
          - PngLifeline_Keyword_AddsTextRowAboveLabel
          - PngLifeline_DashedHeaderAppearance_HasGapsAlongTopEdge

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-LabelsAvoidBoxes
        title: >-
          CanvasNetRasterRenderer shall place connector midpoint labels with the obstacle-aware label
          placer so a label whose line midpoint lies on a leaf box does not erase that box's border.
        justification: |
          A connector label is painted over an opaque backplate; at a midpoint on a leaf box it would
          erase the box border and text. Passing every box to ConnectorLabelPlacer as an obstacle
          moves the label to a clear position on the line.
        tests:
          - PngLineLabel_MidpointOnLeafBox_DoesNotEraseBoxBorder

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-DiamondShape
        title: >-
          CanvasNetRasterRenderer shall draw a diamond-shaped box as a filled and stroked path through
          the same four bounding-box edge midpoints the SVG renderer uses, honoring the dash pattern,
          so a diamond looks the same in PNG and SVG.
        justification: |
          Connectors anchor on the diamond outline, so the raster outline must pass through the same
          vertices as the vector one; sharing the vertex helper makes the two identical by
          construction, and a parity test reads the SVG polygon back against PNG pixels.
        tests:
          - PngDiamond_HasInkAtTheFourVertices
          - PngDiamond_BoundingBoxCornersAreEmpty
          - PngDiamond_InteriorIsFilledWithTheDepthFill
          - PngDiamond_Dashed_HasLessInkAlongTheEdgeThanSolid
          - SysmlPortsParity_DiamondShape_PngOutlineMatchesSvgPolygon
