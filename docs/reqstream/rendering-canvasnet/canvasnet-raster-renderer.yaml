---
# DemaConsulting.Rendering.CanvasNet - CanvasNetRasterRenderer Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the CanvasNetRasterRenderer unit: the shared CanvasNet rasterizer
#   that draws placed layout-tree nodes to a managed surface before concrete format renderers
#   encode it.
# - These unit requirements decompose the Rendering-CanvasNet-RenderRasterImage system requirement
#   declared in rendering-canvasnet.yaml.

sections:
  - title: CanvasNetRasterRenderer Requirements
    requirements:
      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-DrawsLayoutTree
        title: >-
          CanvasNetRasterRenderer shall rasterize every layout-tree node kind - boxes, labels,
          lines, ports, badges, bands, lifelines, activations, and grids - onto a surface
          initialized with the render theme's background color.
        justification: |
          The base rasterizer draws all node kinds so that every concrete format renderer produces
          a complete diagram; the theme background makes the output usable in formats without
          transparency, such as JPEG, while keeping the canvas fill, hollow-marker occlusion, and
          midpoint-label backplates consistent under non-white themes.
        tests:
          - PngRenderer_Render_SingleBox_ProducesNonEmptyOutput
          - PngRenderer_Render_BackgroundIsThemeBackground
          - PngRenderer_Render_SingleLine_PixelOnLineIsStrokeColor
          - PngRenderer_Render_SinglePort_CenterPixelIsStrokeColor
          - PngRenderer_Render_SingleBadge_FilledCircle_CenterPixelIsStrokeColor
          - PngRenderer_Render_SingleLifeline_StemPixelIsStrokeColor
          - PngRenderer_Render_SingleActivation_CenterPixelIsWhite
          - PngRenderer_Render_SingleBand_BorderIsStrokeColor
          - PngRenderer_Render_DeeplyNestedBoxes_DoesNotStackOverflow
          - PngRenderer_Render_LabelWithXmlSpecialCharacters_ProducesValidPng

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-ThemeColours
        title: >-
          CanvasNetRasterRenderer shall derive box and grid fill colours from the render theme,
          indexing the depth-fill palette by nesting depth.
        justification: |
          Deriving colours from the theme keeps raster output visually consistent with the SVG
          renderer and lets callers restyle diagrams by supplying a different theme.
        tests:
          - PngRenderer_Render_SingleBox_FillColorMatchesTheme
          - PngRenderer_Render_SingleBox_DepthOneUsesSecondColor
          - PngRenderer_Render_SingleGrid_HeaderFillMatchesTheme

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EndMarkers
        title: >-
          CanvasNetRasterRenderer shall draw connector end markers whose geometry derives from the
          shared notation metrics, so raster markers match the SVG markers.
        justification: |
          End markers express relationship direction and kind; sharing the notation metrics with the
          SVG renderer keeps the two output formats visually identical.
        tests:
          - FilledArrow_AlongLength_MatchesNotationMetrics
          - FilledArrow_BaseWidth_MatchesNotationMetrics
          - OpenChevron_HasFewerInkPixelsThanClosedTriangle
          - PngRenderer_Render_DrawArrowhead_OpenWithCrossbar_ProducesNonEmptyOutput

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-EmptyTree
        title: >-
          CanvasNetRasterRenderer shall render an empty layout tree to a valid image with a minimum
          surface size of one by one pixels.
        justification: |
          Enforcing a minimum surface size prevents allocation errors for empty diagrams, so callers
          never have to special-case an empty layout.
        tests:
          - PngRenderer_Render_EmptyTree_WritesPngSignature

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-PortAndContentInset
        title: >-
          CanvasNetRasterRenderer shall draw each port's glyph and label inside the box,
          immediately next to the glyph, reading inward toward the box interior on every one of the
          four sides, and shall start box title/compartment content at box.X plus
          Theme.LabelPadding plus box.ContentInsetLeft (mirroring the SVG renderer) rather than a
          fixed offset that ignores a reserved port-label margin.
        justification: |
          The raster renderer must match the SVG renderer's port-label placement and reserved-margin
          behavior so both output formats produced from the same LayoutTree read identically to a
          viewer, per the single-layout/multi-renderer design.
        tests:
          - PngRenderer_RenderPort_AnySide_ProducesNonBackgroundPixels
          - PngRenderer_RenderBoxCompartments_ContentInsetLeft_ShiftsRowContentRight

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-PortLabelSqueeze
        title: >-
          CanvasNetRasterRenderer shall bound a rendered port label's width to
          LayoutPort.MaxLabelWidth using the same font-size-shrink squeeze mechanism used for box
          titles, rather than always drawing the label at its natural full text width.
        justification: |
          A port's ExternalLabel previously rendered at natural full text width with no bound
          relative to the box width or the opposite port's label region, so an excessively long
          port label could visually overlap the opposite port's label. A MaxLabelWidth defaulting
          to positive infinity leaves every port with no explicit bound rendering exactly as before.
        tests:
          - PngRenderer_RenderPort_LongLabelWithMaxLabelWidth_SqueezesToFit

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-TitleCentersOnBoxWidth
        title: >-
          CanvasNetRasterRenderer shall horizontally center a box's keyword line and bold name
          title on the box's full geometric width (box.X + box.Width / 2.0), regardless of any
          asymmetric box.ContentInsetLeft/ContentInsetRight the box declares.
        justification: |
          A box's title occupies its own row above the title area (ResolveTitleAreaTop), while
          left/right port labels are drawn at the box's vertical center (DrawPortLabel) — a
          different row — so the title never needs to dodge sideways around a side-port label's
          inset. An earlier revision centered the title on the inset-adjusted content area instead,
          which visibly shifted and squeezed titles on boxes with an asymmetric left/right
          port-label inset even though no actual title/port-label collision was possible; this
          requirement restores full geometric centering, matching the SVG renderer.
          box.ContentInsetTop still legitimately widens the title's vertical (Y) start position
          when a top-side port shares the title's row, which is unaffected by this requirement.
        tests:
          - PngRenderer_RenderBoxTitle_AsymmetricContentInsets_StaysAtGeometricCenter

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-PortGlyphOutline
        title: >-
          CanvasNetRasterRenderer shall draw a contrasting stroke (Theme.BackgroundColor) around a
          port glyph's rendered square, distinct from the glyph's own fill (Theme.StrokeColor).
        justification: |
          A port glyph's solid fill and a connector arrowhead marker's solid fill both use the same
          stroke color and can land within a few pixels of each other at a box edge, so without a
          contrasting outline the two shapes visually merge into a single indistinguishable blob.
          Outlining the port glyph in the background color keeps it visually distinct from an
          adjacent arrowhead, matching the SVG renderer.
        tests:
          - PngRenderer_RenderPort_Rect_HasStrokeDistinctFromFill

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-CanvasGrowsForLabels
        title: >-
          CanvasNetRasterRenderer shall grow the allocated surface width and height, after
          connector-label placement is finalized, to include the full bounding-box extent of every
          placed connector label, rather than sizing the surface purely from box and routing
          geometry before label placement runs.
        justification: |
          ConnectorLabelPlacer nudges colliding midpoint labels perpendicular to their line, with
          fallback stacking; because the prior raster size was computed from box and routing
          geometry before this nudging ran, a label could be nudged completely outside the surface
          and render invisibly clipped. Deferring the surface-size computation until every label's
          final position (and estimated extent) is known lets the surface grow to keep every label
          fully visible.
        tests:
          - PngRenderer_Render_ManyCollidingConnectorLabels_BitmapGrowsToFitAllLabels

      - id: Rendering-CanvasNet-CanvasNetRasterRenderer-SharedTypefaces
        title: >-
          CanvasNetRasterRenderer shall resolve a stable, distinct TrueTypeFont instance per
          bold/italic variant through the internal CanvasNetTypefaces helper, shared by all drawing
          code in the unit.
        justification: |
          CanvasNetRasterRenderer's four regular/bold/italic/bold-italic typeface variants are
          centralized in one internal helper so every drawing call site in the unit measures and
          draws against the exact same lazily loaded embedded Noto Sans typeface instances, with no
          duplicate independently loaded copy of the font resources.
        tests:
          - CanvasNetTypefaces_Resolve_ReturnsStableDistinctTypefacesPerVariant
