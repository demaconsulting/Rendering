---
# DemaConsulting.Rendering (Model) - Layout Tree Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the layout-tree unit: the placed, renderer-agnostic
#   intermediate representation (LayoutTree and the LayoutNode discriminated-union of concrete
#   node records, plus the shared Point2D / Rect geometry value types).
# - These unit requirements decompose the Rendering-Model-LayoutTree system requirement declared
#   in rendering.yaml.

sections:
  - title: Layout Tree Requirements
    requirements:
      - id: Rendering-Model-LayoutTree-Canvas
        title: >-
          The layout tree shall carry the canvas width, the canvas height, and the ordered list of
          top-level nodes that make up a rendered view.
        justification: |
          A renderer needs the overall canvas size to establish the drawing surface and needs the
          ordered node list to draw every element of the view.
        tests:
          - LayoutTree_Construction_StoresWidthHeightNodes

      - id: Rendering-Model-LayoutTree-AbsoluteCoordinates
        title: >-
          Every positioned node shall carry absolute coordinates that are preserved without any
          further transformation being applied by the model.
        justification: |
          Absolute coordinates let a renderer draw each element directly from the tree without
          resolving nested offsets, which keeps renderers simple and their output deterministic.
        tests:
          - LayoutBox_Coordinates_AreAbsolute
          - LayoutPort_Coordinates_AreAbsolute
          - LayoutLine_Waypoints_AreAbsolute

      - id: Rendering-Model-LayoutTree-Box
        title: >-
          A box node shall carry its position, size, optional label, nesting depth, shape, ordered
          compartments, and nested child nodes.
        justification: |
          Boxes are the primary container element; carrying compartments and children lets the
          model represent nested definitions and usages that renderers draw recursively.
        tests:
          - LayoutBox_Construction_StoresAllFields
          - LayoutBox_Children_ContainsNestedNodes

      - id: Rendering-Model-LayoutTree-DepthNotColor
        title: >-
          A box node shall express its visual nesting as an integer depth rather than a resolved
          color.
        justification: |
          Storing depth rather than a color keeps the model free of theme decisions, so the theme
          in effect at render time selects the fill color for each nesting level.
        tests:
          - LayoutBox_Depth_IsInteger

      - id: Rendering-Model-LayoutTree-ContentInset
        title: >-
          A box node shall carry four independently settable ContentInsetLeft/Right/Top/Bottom
          values, defaulting to zero, reserving a per-side margin a renderer must respect when
          positioning title, compartment, or child content.
        justification: |
          A named port rendered on a box's face needs its label drawn without colliding with the
          box's own title/compartment content; a reserved, auto-computed margin per side lets a
          renderer read where content may start and must stop instead of assuming a fixed
          box.X + Theme.LabelPadding offset that ignores any ports on that face. Defaulting to zero
          keeps every existing caller's box byte-identical when no port occupies a given side.
        tests:
          - LayoutBox_ContentInsets_DefaultZero
          - LayoutBox_ContentInsets_IndependentlySettable

      - id: Rendering-Model-LayoutTree-Port
        title: >-
          A port node shall carry its absolute centre, the box edge it is attached to, an optional
          external label, and an optional internal label.
        justification: |
          Ports pin connection points to box edges; carrying the attached side lets a renderer
          offset the port symbol and its labels away from the box face correctly. A plain port carries
          only an external label (rendered inward beside the glyph, exactly as the single legacy label
          was, keeping every pre-existing call site byte-identical). A boundary (delegation) port
          additionally carries an internal label: its presence marks the port as a boundary port and
          moves the external label to the outward face while the internal label reads inward, so one
          physical anchor can name both the connection reaching it from outside the container and the
          delegation relaying it into the container's own child scope.
        tests:
          - LayoutPort_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-PortMaxLabelWidth
        title: >-
          A port node shall carry an optional maximum label width, defaulting to positive infinity
          (no bound) so every existing construction call site is unaffected.
        justification: |
          A `LayoutPort` has no reference back to its owning box, so a renderer cannot itself bound
          an excessively long port label's rendered width to avoid it visually overlapping the
          opposite port's label region; a layout algorithm that already knows the owning box's
          placed width must precompute that bound and carry it on the port. Defaulting to positive
          infinity means a port with no explicit bound renders exactly as before (unconstrained).
        tests:
          - LayoutPort_Construction_DefaultsMaxLabelWidthToPositiveInfinity
          - LayoutPort_Construction_StoresExplicitMaxLabelWidth

      - id: Rendering-Model-LayoutTree-Line
        title: >-
          A connector line node shall carry its ordered waypoints, its source and target end-marker
          styles, its stroke style, and an optional midpoint label.
        justification: |
          Connectors express relationships; carrying pre-routed waypoints, end markers, and stroke
          style lets a renderer draw the connector and its decorations without re-routing.
        tests:
          - LayoutLine_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Label
        title: >-
          A label node shall carry its position, maximum width, text, alignment, font weight, font
          style, and font size.
        justification: |
          Standalone labels carry names and annotations; carrying explicit font styling and a
          maximum width lets a renderer emphasize and fit text consistently.
        tests:
          - LayoutLabel_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Badge
        title: >-
          A badge node shall carry its centre, size, shape, and an optional label.
        justification: |
          Badges are small notation icons; carrying shape and size lets a renderer draw the correct
          icon at the correct scale beside its optional label.
        tests:
          - LayoutBadge_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Band
        title: >-
          A band node shall carry its bounds, orientation, an optional label, and nested child
          nodes.
        justification: |
          Swim-lane bands group elements; carrying orientation and children lets a renderer draw the
          lane and its contents in the correct axis.
        tests:
          - LayoutBand_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Lifeline
        title: >-
          A lifeline node shall carry its centre, its top and bottom extent, its header label, and
          its header dimensions.
        justification: |
          Sequence-diagram lifelines are a header box over a vertical stem; carrying both the extent
          and the header size lets a renderer draw the header and dashed stem consistently.
        tests:
          - LayoutLifeline_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Activation
        title: >-
          An activation node shall carry its centre and its top and bottom extent.
        justification: |
          An activation bar marks when a lifeline is active; carrying its centre and extent lets a
          renderer draw the narrow bar over the lifeline stem.
        tests:
          - LayoutActivation_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Grid
        title: >-
          A grid node shall carry its position and its ordered rows, each row flagged as header or
          body and each cell carrying its size, text, alignment, and column span.
        justification: |
          Tabular notation (for example requirement tables) needs per-row header styling and
          per-cell spans so a renderer can draw the table faithfully.
        tests:
          - LayoutGrid_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-Geometry
        title: >-
          The layout tree unit shall provide shared immutable point and axis-aligned rectangle value
          types, in logical pixels, that positioned nodes and layout algorithms use to express
          coordinates and bounds.
        justification: |
          A single Point2D and Rect value type gives every node record and every layout algorithm one
          consistent, allocation-light geometry vocabulary, so coordinates and bounds are expressed
          and compared the same way throughout the model.
        tests:
          - Point2D_Construction_StoresXY
          - Rect_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-ShapeGeometryHints
        title: >-
          A placed box shall be able to carry optional resolved shape-geometry hints for a rounded
          corner radius and a folder tab's width and height.
        justification: |
          Once layout has produced placed boxes, both connector routing and rendering operate from the
          layout tree rather than the original input graph. Carrying any optional resolved shape
          geometry on the placed box lets both later stages agree on the same physical outline.
        tests:
          - LayoutBox_Construction_StoresAllFields

      - id: Rendering-Model-LayoutTree-EndMarkerStyles
        title: >-
          The end-marker style enumeration shall provide hollow-triangle-with-two-dots,
          hollow-triangle-with-four-dots, and circled-plus members appended after the existing
          members, leaving every existing member's ordinal unchanged.
        justification: |
          SysML v2 draws feature typing, reference subsetting, and owned membership with distinct end
          decorations. Appending the new members (never renumbering) keeps persisted or interop
          enumeration values stable and leaves every existing caller's output unchanged.
        tests:
          - EndMarkerStyle_LegacyOrdinals_ArePinnedAndNewMembersAppended

      - id: Rendering-Model-LayoutTree-BoxAppearance
        title: >-
          A box node shall carry an optional appearance (outline stroke style, name text style,
          keyword text style, folder title placement, and corner icon) in which a null appearance and
          a default appearance both mean the legacy look, and the model shall provide the text-style
          presets used to express it.
        justification: |
          SysML v2 notation needs dashed and dotted outlines, regular or italic names, a folder name
          drawn in the tab, and send/accept corner icons. Grouping them in one optional appearance
          with legacy defaults (solid outline, bold name, italic keyword, body title, no icon) lets a
          caller opt in per box while every existing box renders exactly as before.
        tests:
          - TextStyle_Presets_PairNamedWeightAndStyle
          - BoxAppearance_Defaults_ResolveLegacyLook
          - BoxAppearance_ExplicitStyles_OverrideLegacyDefaults
          - LayoutBox_Appearance_DefaultsToNull

      - id: Rendering-Model-LayoutTree-CompartmentTitleStyle
        title: >-
          A compartment shall carry an optional title alignment (left by default) and an optional
          title text style (bold italic by default).
        justification: |
          SysML v2 compartment titles are centered and not bold; carrying the alignment and style on
          the compartment lets a caller select that look while defaults keep the legacy left-aligned
          bold-italic title for every existing compartment.
        tests:
          - LayoutCompartment_Defaults_KeepLegacyTitle
          - LayoutCompartment_ExplicitTitleAlignAndStyle_AreCarried

      - id: Rendering-Model-LayoutTree-BadgeThickBar
        title: >-
          The badge shape enumeration shall provide thick horizontal and thick vertical bar members
          appended after the existing members, and a badge shall carry an optional bar thickness
          defaulting to none.
        justification: |
          SysML v2 fork and join nodes are thick filled bars whose length is chosen by the caller;
          appending the shapes and an optional thickness keeps existing badge ordinals and call sites
          unchanged while a null thickness selects the shared default bar thickness.
        tests:
          - BadgeShape_LegacyOrdinals_ArePinnedAndNewMembersAppended
          - LayoutBadge_Thickness_DefaultsToNull

      - id: Rendering-Model-LayoutTree-BadgeCrossedCircle
        title: >-
          The badge shape enumeration shall provide a crossed-circle member appended after the
          existing members.
        justification: |
          The SysML v2 terminate node is a circle crossed by an X; appending the shape keeps the
          existing badge ordinals stable.
        tests:
          - BadgeShape_LegacyOrdinals_ArePinnedAndNewMembersAppended

      - id: Rendering-Model-LayoutTree-BandOutlineStyle
        title: >-
          A band node shall carry an outline stroke style defaulting to solid.
        justification: |
          SysML v2 swim lanes that are not solid partitions are drawn dashed; carrying the style on the
          band lets a caller select it while the solid default keeps every existing band unchanged.
        tests:
          - LayoutBand_OutlineStyle_DefaultsToSolid

      - id: Rendering-Model-LayoutTree-LifelineHeaderStyle
        title: >-
          A lifeline node shall carry an optional keyword, a header shape (rectangle by default), an
          optional header appearance, and an optional header corner radius, all defaulting to the
          legacy look.
        justification: |
          Sequence-diagram participants may be drawn with a keyword line, a rounded header, a
          non-bold name, or a dashed header outline; carrying those on the lifeline lets a caller
          opt in while a lifeline built with only its legacy members is unchanged.
        tests:
          - LayoutLifeline_NewMembers_DefaultToLegacyLook

      - id: Rendering-Model-LayoutTree-DiamondShape
        title: >-
          The box shape enumeration shall provide a diamond member appended after the existing
          members, so existing shape ordinals are unchanged.
        justification: |
          Decision and merge nodes are diamonds whose connectors must attach to the outline rather than
          the bounding box (Rendering#58); appending the member keeps every existing shape ordinal and
          default (rectangle) stable for callers that never use it.
        tests:
          - BoxShape_LegacyOrdinals_ArePinnedAndDiamondAppended
