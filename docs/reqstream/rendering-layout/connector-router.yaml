---
# DemaConsulting.Rendering.Layout - ConnectorRouter Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the connector-router unit.
# - This file is part of the split Rendering.Layout requirements set.

sections:
  - title: ConnectorRouter Requirements
    requirements:
      - id: Rendering-Layout-ConnectorRouter-AnchorsFaceEachOther
        title: >-
          ConnectorRouter shall anchor each connector on the box side whose outward normal best points
          at the opposing box, so connectors leave and arrive on the faces the two boxes present to
          each other.
        justification: |
          A connector reads as joining two boxes only when it leaves and enters the faces that point
          at one another; anchoring toward the opposing box centre produces that presentation
          regardless of the boxes' relative positions.
        tests:
          - Route_TargetToTheRight_AnchorsFaceEachOther
          - Route_TargetBelow_AnchorsFaceEachOther

      - id: Rendering-Layout-ConnectorRouter-ShapeAwareAnchors
        title: >-
          ConnectorRouter shall respect each chosen face's connectable extents, shall fall back to the
          next-best usable face when the naturally-facing face is unusable, and shall project the final
          anchor inward from the bounding box to the box shape's real outline.
        justification: |
          Some shapes do not use the entire bounding-box face as a valid connection surface: a folder's
          raised tab occupies part of the top edge, a rounded rectangle's corner arcs remove the face
          ends, and future shapes may recess or notch a face. Connector anchors must therefore be
          selected from the usable sub-ranges of a face, must pick a different face when the natural
          one has no usable range, and must touch the drawn outline rather than an enclosing rectangle.
        tests:
          - Route_FolderTopFace_TabExcludedFromConnectableExtent
          - Route_FolderTopFace_WidthOnlyHint_UsesFallbackTabHeight
          - Route_FolderTopFace_HeightOnlyHint_UsesFallbackTabWidth
          - Route_FolderTopFace_ProjectsAnchorToRecessedBodyTop
          - Route_FaceSelectionFallback_EmptyNaturalFaceUsesAdjacentFace

      - id: Rendering-Layout-ConnectorRouter-MinimumAnchorSeparation
        title: >-
          ConnectorRouter shall keep the anchors of connectors landing on one box face at least
          16 px apart, including anchors already occupied there by connectors routed elsewhere, using
          the marker-aware corner-margin region of the face when the clearance-inset region cannot hold
          them that far apart.
        justification: |
          Connector end markers are about 15 px long and 10 px wide, so anchors closer than 16 px make
          neighboring markers touch or overlap and the connectors hard to trace (diagram-quality
          criterion C6). A short face with the 12 px connector clearance on each end (a 50 px box) has
          no position 16 px from an interior connector's centered anchor, so the usable region widens
          to the corner margin (8 px, or 10 px for a circled plus) before a connector is crowded.
        tests:
          - RouteBatch_FixedAnchorOnShortFace_ExternalAnchorKeepsSeparation
          - Route_ManyConnectorsIntoShortFace_AnchorsAtLeast16Apart
          - Apply_CrossHierarchyRepro1_AnchorsOnSharedFaceAtLeast16Apart
          - Apply_ManyCrossHierarchyEdgesIntoOneBox_AnchorsAtLeast16Apart
          - Gallery_ManyEdgesIntoShortBox_RendersSvgWithSeparatedAnchors

      - id: Rendering-Layout-ConnectorRouter-FaceOverflowToAdjacentFace
        title: >-
          When more connectors converge on a box face than it can hold 16 px apart, ConnectorRouter
          shall keep the connectors nearest the face's middle on it and move the overflow, from each end
          of the ordering and only toward the side their counterpart lies on, to the adjacent face, in an
          order that keeps the wrapped connectors from crossing, and shall fall back to an even spread
          when every candidate face is full.
        justification: |
          Some boxes are too short for the connectors they receive (nine edges into a 50 px face). Rather
          than crowd them, the router spreads them over the box's other faces, so every anchor keeps its
          clear 16 px and every connector stays individually traceable, while a face that is full on
          every side still routes (best effort) instead of failing.
        tests:
          - Route_FaceOverCapacity_OverflowUsesAdjacentFace
          - Route_NineParallelEdgesIntoCompartmentBox_DoNotLoopBehindEitherBox

      - id: Rendering-Layout-ConnectorRouter-SharedFaceDistribution
        title: >-
          When several connectors share one box face, ConnectorRouter shall distribute their anchors
          across the union of that face's connectable extents rather than across the full bounding-box
          span.
        justification: |
          A shape may reserve parts of a face for its own outline geometry, such as a folder tab on the
          top edge. Shared-face anchor spreading must use only the usable connection ranges so multiple
          connectors remain both distinct and valid for the shape they terminate on.
        tests:
          - Route_SharedFolderTopFace_DistributesAcrossReducedExtent

      - id: Rendering-Layout-ConnectorRouter-AvoidsObstacles
        title: >-
          ConnectorRouter shall route a connector around an intervening box without passing through
          that box's interior, using axis-aligned segments.
        justification: |
          Connectors that cut through unrelated boxes are unreadable; the orchestration must steer the
          route around boxes that lie between the two endpoints while keeping the path orthogonal.
        tests:
          - Route_ObstacleBetweenEndpoints_RoutesAroundInterior

      - id: Rendering-Layout-ConnectorRouter-ExcludesEndpoints
        title: >-
          ConnectorRouter shall treat a connection's own endpoint boxes as ordinary obstacles while
          still letting the connector leave and enter their faces, by routing through a perpendicular
          approach stub that clears each endpoint before the true anchor is reattached.
        justification: |
          Excluding endpoint boxes entirely left a gap through which an unrelated, already-routed
          connector's soft obstacles could squeeze a later connector into its own target box's
          interior. Treating endpoints as solid obstacles and relying on the router's existing
          stub-then-dock approach keeps the connector's own docking free while closing that gap.
        tests:
          - Route_EndpointBoxes_ReachBoundaryAnchorsViaApproachStub
          - Route_NineParallelEdgesIntoCompartmentBox_DoNotCrossTargetInterior

      - id: Rendering-Layout-ConnectorRouter-CarriesStyling
        title: >-
          ConnectorRouter shall carry a connection's requested target end marker, line style, and
          label onto the produced connector line and shall leave the source end unmarked.
        justification: |
          The routing orchestration owns only geometry; the caller's styling choices must survive onto
          the placed line so renderers draw the intended arrowhead, stroke, and label.
        tests:
          - Route_Connection_CarriesRequestedStyling

      - id: Rendering-Layout-ConnectorRouter-BatchOrder
        title: >-
          Given a list of connections, ConnectorRouter shall return one routed connector line per
          connection in the input order.
        justification: |
          Callers correlate produced lines with their connections positionally; a stable one-to-one,
          in-order result keeps that correlation unambiguous.
        tests:
          - Route_MultipleConnections_ReturnsOneLinePerConnectionInOrder

      - id: Rendering-Layout-ConnectorRouter-Validation
        title: >-
          ConnectorRouter shall reject a null box list, connection list, connection, or options
          argument with an argument-null error.
        justification: |
          Failing fast on null arguments prevents undefined behavior and surfaces caller errors at the
          public routing boundary.
        tests:
          - Route_NullBoxes_Throws
          - Route_NullConnections_Throws
          - Route_NullOptions_Throws
          - Route_NullConnection_Throws

      - id: Rendering-Layout-ConnectorRouter-AlignsPortsToLane
        title: >-
          When a free lane lies inside the spans of both facing faces, ConnectorRouter shall slide the
          connector's ports along their faces onto that lane and draw one straight segment, for every
          facing orientation, with the single-connection and batch overloads agreeing; a port shall
          never be slid into a face corner (closer than the port-corner margin) or into a part of the
          face that the box shape does not allow connectors to use.
        justification: |
          Anchors chosen before obstacle avoidance sit at the face centers, so a connector whose
          straight line is blocked used to step off its face, jog around the obstacle and jog back
          right before its arrowhead although a free lane existed inside both faces. Letting the router
          pick the ports along each face removes the jog and leaves one straight connector. The slide
          range is inset from each face end by the port-corner margin (derived from the rendered marker,
          see the decoration requirement), so a lane that would leave the arrowhead overhanging a corner
          is refused and that connector keeps its clean jog.
        tests:
          - Route_LaneWithinBothFaceSpans_ProducesSingleStraightSegment
          - Route_LaneWithinOnlyOneFaceSpan_UsesAtMostTwoBends
          - Route_SlideMargin_PortKeepsDecorationInsideFace
          - Route_SingleOverload_MatchesBatchForSlidRoute
          - Route_RoundedFaces_SlideStaysWithinConnectableExtent
          - ConnectorRouter_Route_SmallSharedSpanOnLongFace_SlidesPortIntoSpanAndGoesStraight
          - ConnectorRouter_Route_SharedSpanNearCornerOfLongFace_UsesClearanceInset
          - ConnectorRouter_Route_ShortFaceForMargin_UsesFaceCenter

      - id: Rendering-Layout-ConnectorRouter-DecorationWithinFace
        title: >-
          ConnectorRouter shall keep every port it slides along a face at least the reach of the
          rendered end marker — the marker's half-width at the renderers' stroke scale plus the marker
          outline stroke plus half the box border's stroke, 8 px at the default theme — from both ends
          of that face, so no arrowhead wing touches or overhangs a box corner; a face too short to hold
          a port that far from both ends shall keep its centered anchor.
        justification: |
          The renderers draw end markers at the connector stroke width scale, so an arrowhead reaches
          about 6.4 px (a diamond about 7.1 px) to either side of the line. A port nearer than that to a
          corner leaves the wing flush with, or past, the box border — a visible defect that the earlier
          fixed 5 px margin (the unscaled half-width) allowed. Deriving the margin from the notation and
          theme metrics keeps it correct if either changes, and a lane that cannot honor it is refused
          rather than drawn with an overhanging arrowhead.
        tests:
          - Route_SlideMargin_PortKeepsDecorationInsideFace
          - ConnectorRouter_Route_SmallSharedSpanOnLongFace_SlidesPortIntoSpanAndGoesStraight
          - ConnectorRouter_Route_FaceShorterThanTwoMargins_KeepsCentre
          - RouteBatch_Profile_NarrowOverlapSweep_NoTinyJogsAndPortsClearOfCorners

      - id: Rendering-Layout-ConnectorRouter-SlidePreservesDistinctPorts
        title: >-
          When several connectors share a box face, a port that ConnectorRouter slides along that face
          shall stay between its neighbors on the face, in the original order, and at least the
          smaller of the batch separation and its current distance away from each of them; no
          connector shall be slid onto a lane that overlaps an earlier connector's route.
        justification: |
          Sliding a port must not collapse the spread that keeps co-terminating connectors visually
          distinct and individually traceable, nor merge a straightened connector into an existing
          connector's lane.
        tests:
          - Route_SharedFace_SlideKeepsDistinctOrderedPorts
          - Route_SharedFace_SlideRefusedWhenItWouldCrowdNeighbor
          - Route_FiveConnectorsNarrowGap_InteriorCorridorsDoNotOverlapAlongLength

      - id: Rendering-Layout-ConnectorRouter-MinimumEndLegs
        title: >-
          When a jog between the two ends is unavoidable, ConnectorRouter shall keep at least the
          connector stub as the straight first leg and at least the rendered end-marker length (the
          notation length times the marker scale both renderers draw it at) plus the bend radius as
          the straight final leg, wherever the gap between the faces allows it, and shall
          still return a route that crosses no box when the gap is too narrow to hold both legs.
        justification: |
          An arrowhead that sits directly on a bend, or a connector that bends the moment it clears its
          face, looks cramped and can render with a clamped corner. The renderers clamp the corner
          radius to the final leg, so the legs must be long enough for the marker, as it is drawn,
          plus the radius.
        tests:
          - Route_LaneOutsideBothFaceSpans_KeepsJogWithMinimumLegs
          - Route_NarrowGapJog_StillReturnsRouteAndNeverCrossesBoxes

      - id: Rendering-Layout-ConnectorRouter-WallsAndFaceSelection
        title: >-
          When given a cross-hierarchy routing profile, ConnectorRouter shall keep a connector's runs
          and bends at least twice the clearance from the supplied container walls — those of the
          containers enclosing its endpoints and of every other container alike — crossing a wall only
          at right angles, shall keep a comfortable straight leg (at least twice the clearance) at both
          ends and no interior segment shorter than twice the clearance (a Z with a 3 px jog is
          refused in favor of one whose jog is long enough), and shall try the adjacent faces of its
          endpoints when the natural faces force a detour, choosing the route with the fewest bends.
        justification: |
          A connector that runs along a container border, bends right after leaving its endpoint, jogs
          a few pixels sideways or enters a container through a shielded face under its title band
          looks like a defect even though it is geometrically valid. The profile lets the hierarchical
          engine ask for the stricter, more readable routing without changing any other caller; a
          straight lane only 12 px under an unrelated container's border is refused for the same
          reason as a run hugging an enclosing container's border.
        tests:
          - RouteBatch_ProfileOn_FirstAndLastLegAtLeastComfort
          - RouteBatch_WallsSupplied_NoRunWithinWallMargin_AndCrossesPerpendicularly
          - RouteBatch_UnrelatedWall_StraightLaneInsideKeepOutIsRefused
          - RouteBatch_Profile_NarrowOverlapSweep_NoTinyJogsAndPortsClearOfCorners
          - RouteBatch_ShieldedTopFace_ChoosesAdjacentFaceWithOneBend

      - id: Rendering-Layout-ConnectorRouter-PeerEndZones
        title: >-
          When given a cross-hierarchy routing profile, ConnectorRouter shall keep a connector from
          crossing, or running along, the stretch just outside another connector's end faces — in
          particular within the arrowhead approach of another connector.
        justification: |
          Crossing another connector's line immediately before its arrowhead obscures the arrowhead and
          makes the target of the crossed connector ambiguous.
        tests:
          - RouteBatch_PeerEndZone_LaterConnectorNeverCrossesWithinZoneOfEarlierArrowhead

      - id: Rendering-Layout-ConnectorRouter-FolderTabResolution
        title: >-
          ConnectorRouter shall resolve a folder box's tab width and height through the shared box
          metrics, so a folder whose name is drawn in the tab has a non-connectable tab strip sized to the
          measured name rather than to the historical label-length estimate.
        justification: |
          The router excludes the folder tab from the connectable face, so it must agree exactly with the
          tab the renderers draw. Delegating to one shared resolution removes the duplicated formula and
          keeps the router and both renderers in step when the tab is sized to a name.
        tests:
          - FolderGeometry_NameInTab_UsesMeasuredTabWidth

      - id: Rendering-Layout-ConnectorRouter-PortCornerMargin
        title: >-
          ConnectorRouter shall keep a slid port at least 8 px from its face's corners for every legacy
          end-marker style and at least 10 px for a circled-plus end marker.
        justification: |
          A port slid along a face must keep its decoration inside the face. Every legacy style keeps the
          historical margin so existing routes do not move; the wider circled plus needs a larger margin
          so its circle never overhangs a corner.
        tests:
          - ConnectorRouter_PortCornerMarginFor_LegacyIsEightAndCircledPlusIsTen

      - id: Rendering-Layout-ConnectorRouter-NewEndMarkerClearance
        title: >-
          ConnectorRouter shall keep a straight final leg of at least the rendered along-line length of
          a redefinition (crossbar), dotted-triangle (feature typing or reference subsetting) or
          circled-plus end marker plus the bend radius, as it does for every other end-marker style.
        justification: |
          The notation end markers are longer than the legacy arrowheads; because the required end
          leg and end zone derive from the marker's rendered along-line length (notation length times
          the shared marker scale), a marker sits on a clean straight run without a corner clamped
          inside its footprint, in SVG and PNG alike.
        tests:
          - ConnectorRouter_NewEndMarker_ReservesCleanEndLeg

      - id: Rendering-Layout-ConnectorRouter-DiamondOutlineAnchors
        title: >-
          Connectors to or from a diamond-shaped box shall start or end on the diamond's outline, not on
          its bounding box: the shape geometry shall report the full face as connectable and project an
          along-face coordinate onto the sloped outline (zero at the vertex), and every layout path
          (ConnectorRouter, layered, hierarchical) shall leave the outline perpendicular to the face with
          the connector stub measured from the outline. When several connectors end on one diamond face
          the diamond shall grow so adjacent end markers keep a marker width plus 4 px apart.
        justification: |
          A diamond's outline recedes from its bounding box towards each vertex, so anchoring on the
          bounding box left a gap and a hook between the shape and its connectors (Rendering#58). The
          shape-aware anchor machinery already projects folder tabs inward; giving the diamond a sloped
          projection fixes every algorithm through the same path while a single connector on a face still
          lands exactly on the vertex. A shaped node spreads its ports over the face less the connector
          clearance at each end, so several ends on one diamond face would otherwise land closer together
          than the marker is wide; the diamond grows by that trim and keeps the marker heads a marker
          width plus 4 px apart.
        tests:
          - LayeredLayout_DiamondSourceTwoTargets_Down_FirstRunStartsOnOutlineAndIsClean
          - LayeredLayout_DiamondSingleEdge_AnchorsOnTheVertex
          - LayeredLayout_DiamondSource_AnyDirection_StartsOnOutlinePerpendicular
          - LayeredLayout_DiamondTarget_TwoSources_EndsOnOutlineWithCleanFinalRun
          - LayeredLayout_DiamondDecisionThreeBranches_AnchorsDistinctAndOnOutline
          - ConnectorRouter_Route_DiamondTarget_AnchorsOnOutline
          - HierarchicalLayout_DiamondInsideContainer_CrossContainerEdgeStartsOnOutline
          - DiamondGeometry_ProjectToSurface_IsZeroAtVertexAndLinearToTheCorner
          - ContainmentAndAutoLayout_DiamondNode_PassesShapeThrough
          - LayeredLayout_DiamondTarget_ThreeSources_MarkerHeadsKeepClearOfEachOther
          - LayeredLayout_DiamondTarget_TwoSources_MarkerHeadsKeepClear
          - LayeredLayout_DiamondDecisionThreeBranches_SourceEndsWithoutMarker_KeepClearanceGrowthOnly
          - LayeredLayout_DiamondSingleEdge_KeepsRequestedSizeAndVertexAnchor
          - LayeredLayout_RectangleTarget_ThreeSources_SizeAndAnchorsUnchanged

      - id: Rendering-Layout-ConnectorRouter-EndLabelPropagation
        title: >-
          ConnectorRouter shall carry a connection's source and target end labels onto the routed line.
        justification: |
          Cross-container connectors are routed here rather than by the layered pipeline, so the router
          must copy the labels or they would be lost for every hierarchical diagram.
        tests:
          - ConnectorRouter_Connection_EndLabelsReachRoutedLine

      - id: Rendering-Layout-ConnectorRouter-ExistingLineCrossingCost
        title: >-
          ConnectorRouter shall, when the caller supplies the lines already drawn in the scope (for
          example the interior connectors of a container an edge enters), count a crossing of such a
          line as a routing defect and avoid it when an alternative route exists, still routing the edge
          when none does, and shall route byte-identically when no lines are supplied.
        justification: |
          A connector that crosses a line drawn inside a container it only passes cannot be seen by the
          scope that routes it unless the interior lines are supplied as obstacles. Treating the crossing
          as a defect, not a prohibition, keeps every edge routed and leaves graphs without such lines
          unchanged.
        tests:
          - RouteBatch_ExistingInteriorLine_AvoidsCrossingWhenAlternativeExists
          - RouteBatch_ExistingInteriorLine_NoAlternative_StillRoutes
          - RouteBatch_NoExistingLines_ByteIdentical

      - id: Rendering-Layout-ConnectorRouter-TidyReplacement
        title: >-
          ConnectorRouter shall replace a routed connector by an alternative only when the replacement
          has fewer crossings within a bounded detour (at most 1.25 times the length plus two clearances,
          at most two more bends), or equal crossings, no more bends and a lower visual cost, and in
          either case adds no hairpin and no run within 4 pixels of another connector.
        justification: |
          Avoiding a crossing by wrapping a connector around a container or squeezing it beside another
          connector trades a crossing for a worse picture. Bounding the replacement keeps every
          re-route a net improvement.
        tests:
          - IsTidyReplacement_FewerCrossingsModestDetour_Accepts
          - IsTidyReplacement_FewerCrossingsLongWrap_Rejects
          - IsTidyReplacement_FewerCrossingsManyMoreBends_Rejects
          - IsTidyReplacement_AddsHairpin_Rejects
          - IsTidyReplacement_RunsNearlyOnTopOfAnotherConnector_Rejects
          - IsTidyReplacement_EqualCrossings_AcceptsOnlyLowerVisualCost

      - id: Rendering-Layout-ConnectorRouter-RouteQuality
        title: >-
          The route-quality measure shall report, for a set of routed polylines, the total path length,
          the bend count (collinear waypoints are not bends), the hairpin count (a U-turn made of two
          consecutive opposite bends), and the length of the runs closer than the lane separation of
          another connector, a gap of exactly the separation not counting as close, weighted so nearer
          runs weigh more.
        justification: |
          The router's re-route acceptance, the hierarchical engine's tightening gate and the ordering
          refinement all compare layouts by the same four measures; one shared definition keeps their
          decisions consistent and lets the test metrics be checked against the engine.
        tests:
          - RouteQuality_PathLength_Polyline_SumsSegments
          - RouteQuality_BendCount_CollinearWaypoints_AreNotBends
          - RouteQuality_HairpinCount_EastSouthWest_IsOneHairpin
          - RouteQuality_CloseParallelLength_GapAndOverlap_CountsOnlySqueezedRuns
          - RouteQuality_WeightedCloseParallelLength_NearerRunsWeighMore
          - RouteQuality_Measure_TwoConnectors_SumsAllMetrics
          - RouteQuality_Measure_BenchmarkScene_AgreesWithLayoutQualityMetrics

      - id: Rendering-Layout-ConnectorRouter-BoundedBatchWork
        title: >-
          Given a routing profile whose work budget has been reduced, ConnectorRouter shall route every
          connector of a batch with its plain route only (no alternative-face search, no re-routing pass,
          no wide-lane re-run of the batch); once the budget is exhausted it shall route the remaining
          connectors with the elbow fallback; either way it shall return one orthogonal line per connection,
          and a batch routed at the full effort shall be unchanged by the existence of the budget.
        justification: |
          Nearly all of the cost of routing a batch (99 percent in the measured case) is in the searches
          that try to improve a route that already exists: four face pairs per connector, two re-routing
          passes and a second, wide-lane routing of the whole batch. Shedding them in a deterministic order
          keeps the cost of a large batch roughly proportional to its size while every connector is still
          drawn.
        tests:
          - RouteBatch_ReducedBudget_RoutesEveryConnectionOrthogonally
          - RouteBatch_ExhaustedBudget_RoutesEveryConnectionWithElbow
