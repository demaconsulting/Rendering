---
# DemaConsulting.Rendering.Layout - LayeredLayoutAlgorithm Unit Requirements
#
# PURPOSE:
# - Unit-level requirements for the layered-layout-algorithm unit.
# - This file is part of the split Rendering.Layout requirements set.

sections:
  - title: LayeredLayoutAlgorithm Requirements
    requirements:
      - id: Rendering-Layout-LayeredAlgorithm-Identity
        title: >-
          LayeredLayoutAlgorithm shall expose the stable identifier under which it is selected and
          registered.
        justification: |
          Renderers and registries select an algorithm by its identifier; a stable, well-known value
          lets the layered algorithm be resolved by name.
        tests:
          - Id_IsLayered

      - id: Rendering-Layout-LayeredAlgorithm-PlacesAndRoutes
        title: >-
          LayeredLayoutAlgorithm shall convert a layout graph into a placed layout tree with one box
          per node and one orthogonally routed connector per edge.
        justification: |
          The algorithm is the public bridge from an abstract graph to concrete geometry; every node
          must become a placed box and every edge a routed connector for renderers to draw.
        tests:
          - Apply_ChainGraph_PlacesLayeredBoxesAndRoutesEdges

      - id: Rendering-Layout-LayeredAlgorithm-EmptyGraph
        title: >-
          When given a graph with no nodes, LayeredLayoutAlgorithm shall return an empty placed
          layout tree.
        justification: |
          An empty graph is a valid degenerate case that must yield a well-formed empty canvas rather
          than an error.
        tests:
          - Apply_EmptyGraph_ReturnsEmptyCanvas

      - id: Rendering-Layout-LayeredAlgorithm-Direction
        title: >-
          LayeredLayoutAlgorithm shall arrange the placed layers along the flow direction selected by
          the direction option — top-to-bottom, bottom-to-top, right-to-left, or the default
          left-to-right — reading the selection from the graph in preference to the options.
        justification: |
          Directed views such as action flows and state machines read the placed coordinates expecting
          the layers to progress top-to-bottom; the layout is only correct for them when the algorithm
          honors the requested flow direction rather than always flowing left-to-right.
        tests:
          - Apply_DownDirection_FlowsTopToBottom
          - Apply_DownDirection_DiffersFromRight
          - Apply_DownDirectionOnGraphScope_IsHonored
          - Apply_DefaultDirection_FlowsLeftToRight

      - id: Rendering-Layout-LayeredAlgorithm-NodeSpacing
        title: >-
          LayeredLayoutAlgorithm shall use the node-spacing option to control the minimum gap between
          same-layer nodes, reading the selection from the graph in preference to the options and
          falling back to the property default, which matches the engine's original fixed constant.
        justification: |
          CoreOptions.NodeSpacing previously cascaded correctly but was never read by any bundled
          algorithm, so a caller's requested spacing had no observable effect on the placed layout.
          Honoring it lets callers widen or narrow the gap between sibling nodes without altering the
          default rendering of any existing diagram, since the property's default now matches the
          engine's pre-existing fixed constant.
        tests:
          - Apply_DefaultNodeSpacing_MatchesPriorEngineBehavior
          - Apply_LargerNodeSpacing_WidensGapBetweenSiblings
          - Apply_NodeSpacingOnGraphScope_TakesPrecedenceOverOptions

      - id: Rendering-Layout-LayeredAlgorithm-Validation
        title: >-
          LayeredLayoutAlgorithm shall reject a null graph or null options argument with an
          argument-null error.
        justification: |
          Failing fast on null arguments prevents undefined behavior and surfaces caller errors at the
          public boundary.
        tests:
          - Apply_NullGraph_Throws
          - Apply_NullOptions_Throws

      - id: Rendering-Layout-LayeredAlgorithm-MergeParallelEdges
        title: >-
          LayeredLayoutAlgorithm shall honor CoreOptions.MergeParallelEdges (reading the graph in
          preference to the options, default true): when true, every input edge sharing a directed
          node pair collapses to exactly one emitted LayoutLine, omitting its label entirely whenever
          2+ raw edges collapsed into it (only a pair backed by exactly one raw edge keeps its own
          label); when false, every parallel edge instance is retained as its own
          independently-routed LayoutLine.
        justification: |
          A physical wiring/interconnection diagram (for example separate power, encoder, and sensor
          connectors between the same two components) needs every distinct connector to render as its
          own labeled line; the algorithm previously emitted one LayoutLine per original input edge
          regardless of duplication, stacking every duplicate edge's label on the same drawn line
          rather than collapsing to a single line as intended when merging is left at its default. A
          reader cannot tell which of several collapsed connectors a kept label would have belonged
          to, so keeping any single surviving edge's label is not an acceptable substitute for that
          missing information — the label must be omitted, not merely deduplicated.
        tests:
          - Apply_ParallelEdges_MergeParallelEdgesDefaultTrue_EmitsExactlyOneLine
          - Apply_ParallelEdges_MergeParallelEdgesFalse_RetainsEveryEdge
          - Apply_MergeParallelEdges_GraphOverridesOptions
          - Apply_ParallelEdges_MergeParallelEdgesDefaultTrue_OmitsLabelOnCollapse
          - Apply_SingleEdge_MergeParallelEdgesDefaultTrue_KeepsOwnLabel

      - id: Rendering-Layout-LayeredAlgorithm-PortEmission
        title: >-
          When an edge endpoint is a LayoutGraphPort, LayeredLayoutAlgorithm shall emit a LayoutPort
          at the routed connector's resolved anchor coordinate, carrying the port's ExternalLabel as
          its label and a MaxLabelWidth bounding the label to roughly half the owning box's placed
          width.
        justification: |
          A named port is meaningless without a placed, labeled anchor for a renderer to draw; emitting
          a LayoutPort at the exact coordinate the corridor router already resolved for that connector
          keeps the port glyph and connector endpoint visually coincident. A flat LayoutPort has no
          reference to its owning box, so bounding an excessively long label's rendered width (to
          prevent it visually overlapping the opposite port's label) must be computed here, where the
          owning box's placed width is known, and carried on the port itself for a renderer to apply.
        tests:
          - Apply_EdgeWithPortEndpoint_EmitsLayoutPortWithExternalLabel
          - Apply_EdgeWithPortEndpoint_ComputesFiniteMaxLabelWidth

      - id: Rendering-Layout-LayeredAlgorithm-ContentInset
        title: >-
          LayeredLayoutAlgorithm shall auto-compute each placed box's ContentInsetLeft/Right (the
          widest same-side port label's measured width, via CoreOptions.AssumedFontSize, plus a
          small clearance) and ContentInsetTop/Bottom (a flat fixed height for one text line at
          AssumedFontSize plus padding, widened further when the box also carries its own title, so
          the title's rendered start position — which depends only on the inset, never on the box's
          overall height — cannot visually overlap the top/bottom port's own rendered label), zero on
          any side with no ports.
        justification: |
          A rendered port label needs a reserved margin on its owning box's face so it never collides
          with that box's own title/compartment content; computing the margin at layout time (rather
          than leaving it to each renderer) keeps a single LayoutTree correct for every renderer that
          consumes it, per the single-layout/multi-renderer design. Growing the box's overall height
          alone cannot create this clearance, since a renderer draws both the title and the port label
          at positions independent of the box's total height; only widening the inset itself can.
        tests:
          - Apply_NodeWithLeftPort_ComputesNonZeroContentInsetLeft

      - id: Rendering-Layout-LayeredAlgorithm-AutoGrowMinimumSize
        title: >-
          LayeredLayoutAlgorithm shall emit each box's Width/Height as the maximum of the
          caller-supplied size and the minimum size computed to fit that box's title plus its
          reserved content insets simultaneously, never shrinking below the caller-supplied size, and
          shall re-run placement/packing/spacing against any grown size so a grown box never overlaps
          a sibling positioned relative to a smaller pre-growth footprint.
        justification: |
          A box with a title and top/bottom port insets can need more room than a caller supplied
          (for example a small caller-supplied size with a title and both a top and bottom port);
          silently letting the title and a port label overlap on-screen, or shrinking a caller's
          explicit size, are both unacceptable, so the algorithm must grow — never shrink — a box to
          the computed minimum, and must re-place all nodes so a grown box's siblings are never
          silently overlapped.
        tests:
          - Apply_NodeAlreadyLargeEnough_SizeUnchanged
          - Apply_NodeWithTopAndBottomPorts_TooSmall_AutoGrowsHeight
          - Apply_AutoGrownNode_DoesNotOverlapSiblings
          - Apply_NoNodeNeedsGrowth_PassTwoSkipped_LayoutUnaffected

      - id: Rendering-Layout-LayeredAlgorithm-ParallelLabelSpacing
        title: >-
          LayeredLayoutAlgorithm shall widen the auto-grow minimum-size floor so that, whenever 2+
          connector anchors share a node's face and at least one of those anchored edges carries a
          midpoint label, the node grows large enough along the axis PortDistributor spreads that
          face's anchors along that the even spacing between those anchors is never smaller than a
          label's own bounding-box extent on that axis: for a Left/Right face (anchors spread
          vertically), the node's Height is at least large enough that the spacing is never smaller
          than ConnectorLabelPlacer.EstimateLabelHeight(AssumedFontSize); for a Top/Bottom face
          (anchors spread horizontally), the node's Width is at least large enough that the spacing
          is never smaller than ConnectorLabelPlacer.EstimateLabelWidth(text, AssumedFontSize) for
          the widest labeled anchor's text.
        justification: |
          Straight, evenly-spaced parallel connectors between the same two boxes (for example 3
          independent labeled connectors preserved via MergeParallelEdges = false) previously spaced
          each line only PortDistributor's default lane spacing apart, which for a typical box size
          was smaller than a label's own bounding-box extent on the axis anchors are spread along;
          every label after the first then collided with an already-placed label and was nudged
          perpendicular to its own line by ConnectorLabelPlacer's fallback pass, visually detaching
          the label from the line it names. This defect was originally fixed only for a Left/Right
          face (the only orientation exercised by the shipped gallery/tests at the time), leaving a
          latent, axis-blind gap for a Top/Bottom face (a downward- or upward-flowing diagram), where
          PortDistributor spreads anchors horizontally and growing Height does nothing to relieve the
          crowding. Growing the node just enough that PortDistributor's own even-spacing formula
          matches ConnectorLabelPlacer's label-extent formula on the correct axis lets the placer's
          first-pass (no-nudge) placement succeed for every label instead, so each label lands
          directly on its own line, regardless of whether the diagram flows horizontally or
          vertically.
        tests:
          - Apply_ThreeParallelLabeledEdges_LabelsLandOnTheirOwnLine
          - Apply_ThreeParallelLabeledEdges_Down_BoxWidthGrowsAndLabelsLandOnTheirOwnLine

      - id: Rendering-Layout-LayeredAlgorithm-PortLabelWidthFloor
        title: >-
          LayeredLayoutAlgorithm shall widen the auto-grow minimum-width floor for any node with a
          labeled Left and/or Right port so that Width is at least 2 * ContentInsetLeft and at least
          2 * ContentInsetRight, so that the emitted LayoutPort's MaxLabelWidth (half the placed
          width minus PortLabelClearance) is never smaller than that side's widest reserved port
          label width.
        justification: |
          ContentInsetLeft/Right already reserve exactly (widest same-side port label width plus
          PortLabelClearance) on the box's face, but MaxLabelWidth is computed independently from
          only the box's final placed Width (half of it, minus PortLabelClearance), with no
          reference to the inset that was grown to fit that same label. Whenever a box only grew
          enough to satisfy the title+inset floor (which sums insetLeft + insetRight, not
          2 * either individually), MaxLabelWidth could resolve smaller than the label's own
          measured width, causing a renderer to squeeze (via textLength/lengthAdjust) a label the
          box had already reserved full physical room for via its inset — exactly the defect
          reproduced in the ports-showcase-horizontal gallery diagram. Requiring Width to also be at
          least double each side's inset makes MaxLabelWidth's own formula naturally resolve to no
          less than that side's widest label width once the box has grown to satisfy this floor,
          without needing to change MaxLabelWidth's or the inset's own formulas, and without ever
          shrinking a box below what any other floor already requires.
        tests:
          - Apply_NodeWithLongLeftPortLabel_GrowsWidthEnoughToAvoidSqueeze
          - Apply_NodeWithLongLeftAndRightPortLabels_BothSidesAvoidSqueeze

      - id: Rendering-Layout-LayeredAlgorithm-ShapeAwareRouting
        title: >-
          LayeredLayoutAlgorithm shall project a same-scope connector's endpoint onto a shaped node's
          real outline and shall exclude the shape's non-connectable face regions from candidate
          endpoints, matching ConnectorRouter's shape-geometry rules for the node's BoxShape.
        justification: |
          A node's Shape previously only affected the rendered outline of the placed box; the routed
          connector endpoint still landed on the plain bounding-box face regardless of BoxShape, which
          looked visually inconsistent with an equivalent cross-container edge routed by
          ConnectorRouter (for example a BoxShape.Folder package's connector floating above the
          recessed body instead of touching it). This is genuinely new, observable behavior of the
          public algorithm output, not merely an internal pipeline-stage detail.
        tests:
          - Apply_DownDirection_FolderTarget_ProjectsEndpointToRecessedTop
          - Apply_UpDirection_FolderSource_ProjectsEndpointToRecessedTop
          - Apply_RightDirection_FolderTarget_LeftFaceUnaffectedByTab
          - Apply_LeftDirection_FolderTarget_RightFaceUnaffectedByTab
          - Apply_DownDirection_NoteTarget_ExcludesFoldFromLandingZone
          - Apply_RectangleChain_MatchesPreShapeAwarenessOutput

      - id: Rendering-Layout-LayeredAlgorithm-LayoutOnlyEdges
        title: >-
          LayeredLayoutAlgorithm shall let a layout-only edge influence node placement exactly like a
          real edge while emitting no connector, port, or anchor for it and without changing the label of
          any real connector between the same nodes.
        justification: |
          The hierarchical engine needs the layered placement to account for edges that are routed
          separately between nested nodes; honoring such an edge as a placement hint only, never drawing
          it, lets containers joined by those edges be placed near each other without a spurious line.
        tests:
          - Apply_LayoutOnlyEdge_AffectsLayeringButEmitsNoLine
          - Apply_LayoutOnlyEdgeParallelToRealEdge_KeepsRealEdgeAndItsLabel

      - id: Rendering-Layout-LayeredAlgorithm-RealEdgeNeverHiddenByLayoutOnlyEdge
        title: >-
          LayeredLayoutAlgorithm shall emit the connector of a real edge even when a layout-only edge on
          the same node pair is declared before it and parallel edges are merged.
        justification: |
          Parallel-edge de-duplication keeps the first edge of each pair; if a layout-only placement hint
          could become that representative, the real connector between the pair would silently vanish.
          Real edges therefore always take precedence over layout-only edges as the retained
          representative, whatever order the caller declares them in.
        tests:
          - Apply_LayoutOnlyEdgeDeclaredFirstWithMergeParallelEdges_EmitsRealConnector
          - Apply_LayoutOnlyEdgeFirstThenTwoRealParallelEdgesWithMerge_EmitsOneMergedConnector
          - Apply_LayoutOnlyEdgeFirstWithMergeParallelEdgesFalse_EmitsRealConnectorOnly

      - id: Rendering-Layout-LayeredAlgorithm-UserEdgeIdNeverTreatedAsLayoutOnly
        title: >-
          LayeredLayoutAlgorithm shall treat a caller edge as a real edge whatever its identifier,
          including an identifier that starts with the former reserved layout-only prefix.
        justification: |
          The layout-only marker is held against the edge object, not in its public identifier, so no
          caller-chosen identifier can silently turn a real edge into a placement hint that is never drawn.
        tests:
          - Apply_UserEdgeWithOldReservedPrefix_StillEmitsLine

      - id: Rendering-Layout-LayeredAlgorithm-AppearancePassThrough
        title: >-
          LayeredLayoutAlgorithm shall copy a node's appearance onto the placed box it produces for that
          node, and shall leave the placed box's appearance null when the node has none.
        justification: |
          A node's BoxAppearance (outline style, name and keyword styling, folder title placement, corner
          icon) is only drawn if it reaches the placed layout tree. Passing the reference through
          unchanged lets every renderer draw the notation without the algorithm knowing what it means,
          and keeping it null for an appearance-free node preserves the legacy look and output.
        tests:
          - LayeredLayout_NodeAppearance_ReachesPlacedBox
          - LayeredLayout_NodeWithoutAppearance_StaysNull

      - id: Rendering-Layout-LayeredAlgorithm-FolderTabTitleReserve
        title: >-
          LayeredLayoutAlgorithm shall not reserve a body title band (the title-versus-port top inset)
          for a folder node whose appearance draws its name in the folder tab, unless the node also carries
          a keyword, whose line is still drawn in the body and keeps the title-versus-port inset.
        justification: |
          A folder that draws its name in the tab has no name title in its body. Widening the top content
          inset to keep a top port's label clear of a body title that is not drawn would waste space and
          push the port label away from the box edge for no reason. A keyword line is still drawn in the
          body, so a node with a keyword keeps the clearance (at both the content-inset and the
          port-driven growth sites).
        tests:
          - LayeredLayout_FolderNameInTabWithTopPort_ReservesNoTitleInset
          - LayeredLayout_FolderNameInTabWithKeywordAndTopPort_ReservesTitleInset
          - LayeredLayout_FolderNameInTabWithKeywordAndBottomPort_ReservesTitleInset
          - LayeredLayout_FolderNameInTabWithKeywordAndSmallHeight_GrowsLikeBodyTitled

      - id: Rendering-Layout-LayeredAlgorithm-BackEdgeEntryApproach
        title: >-
          LayeredLayoutAlgorithm shall give the final straight leg of every connector, including a
          reversed (back) edge that wraps around a layer, at least the rendered along-line length of the
          edge's target end marker plus the corner radius plus the clean-leg margin, for every flow
          direction and every end-marker style.
        justification: |
          A reversed edge ends in a wrap-around corridor whose final approach was only the connector
          clearance (10 px), shorter than a rendered open chevron (15 px) plus the rounded corner before
          it. The renderer's corner clamp then collapsed the bend into a sharp corner inside the arrowhead
          footprint, drawing a small hollow triangle at the arrowhead. Deriving the approach from the
          decoration the graph's edges actually carry keeps the marker on a clean straight run.
        tests:
          - LayeredLayout_BackEdgeWithOpenChevron_FinalLegCoversChevronAndCorner
          - LayeredLayout_BackEdgeWithOpenChevron_AllDirectionsKeepCleanFinalLeg
          - LayeredLayout_BackEdgeWithAnyMarker_FinalLegCoversRenderedMarker
          - ResolveBackEdgeEntryApproach_DerivesFromWidestDecoration

      - id: Rendering-Layout-LayeredAlgorithm-BackEdgeEntryApproachLegacyPreserved
        title: >-
          LayeredLayoutAlgorithm shall leave the final legs of forward connectors unchanged and shall keep
          the historical connector-clearance approach for a reversed edge when no edge carries an end
          decoration.
        justification: |
          The longer approach is a fix for decorated back edges only. A graph with no end decorations, and
          the forward edges of a decorated graph, must keep exactly their existing geometry so existing
          diagrams do not move.
        tests:
          - LayeredLayout_BackEdgeWithOpenChevron_ForwardLegsUnchanged
          - LayeredLayout_UndecoratedBackEdge_KeepsLegacyApproach

      - id: Rendering-Layout-LayeredAlgorithm-LabelsClearOfNodeBorders
        title: >-
          LayeredLayoutAlgorithm shall produce a tree of a decorated state-machine graph whose connector
          labels, placed by the obstacle-aware connector-label placer, cross no node border.
        justification: |
          A connector-label background painted over a node border looks like a rendering defect. The
          label placer is given the placed boxes as obstacles; the layout must leave the connectors
          routed so that every label finds a position clear of every box, which the elevator state
          machine that reproduced the defect now demonstrates.
        tests:
          - LayeredLayout_ElevatorLabels_DoNotCrossNodeBorders

      - id: Rendering-Layout-LayeredAlgorithm-EndLabelPassThrough
        title: >-
          LayeredLayoutAlgorithm shall copy each edge's source and target end labels onto its placed
          line, keeping each label with its semantic end when the algorithm reverses a back edge for
          layering, and shall omit them (as it omits the midpoint label) when parallel edges collapse
          into one line.
        justification: |
          A reversed back edge is stored flipped for layering but must still carry its labels at the
          ends the caller declared; a collapsed line cannot honestly carry the ends of several edges.
        tests:
          - LayeredLayout_EdgeEndLabels_ReachPlacedLine
          - LayeredLayout_EdgeWithoutEndLabels_StaysNull
          - LayeredLayout_BackEdge_EndLabelsStayWithTheirSemanticEnds
          - LayeredLayout_MergedParallelEdges_DropEndLabels

      - id: Rendering-Layout-LayeredAlgorithm-EndLabelSpace
        title: >-
          LayeredLayoutAlgorithm shall reserve room for end labels: the corridor an end label's
          connector crosses shall be widened and its first bend pushed out by the label space, and a
          face with two or more labeled connectors shall be sized so adjacent connectors' labels
          overlap no box, no other label, and no connector segment.
        justification: |
          A role name and a multiplicity beside each end need a straight run to sit on and a row or
          column of their own; without reserving them a label would collide with a neighbor or sit
          across a bend. The reservation is zero, and the layout unchanged, for edges without end
          labels.
        tests:
          - LayeredLayout_OwnershipDiagramWithEndLabels_LabelsOverlapNothing
          - LayeredLayout_ChainWithEndLabels_LabelsOverlapNothing
